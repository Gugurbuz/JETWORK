<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/jetwork-favicon.svg" />
    <link rel="stylesheet" href="/src/assistant-work-indicator-speed.css" />
    <title>JetWork</title>
    <style>
      /* Provider/model telemetry is operational metadata, not chat content.
         Keep historical rows with previously persisted provider values clean too. */
      .chat-scroll-container [title="openai"],
      .chat-scroll-container [title="gemini"],
      .chat-scroll-container [title^="gpt-"],
      .chat-scroll-container [title^="gemini-"] {
        display: none !important;
      }

      /* Migration guard: stale legacy model selectors can still exist in old UI
         surfaces while the canonical selector is CompactModelControl/Settings.
         Never expose those stale Gemini choices to end users. */
      select:has(option[value="gemini-3-flash-preview"]),
      select:has(option[value="gemini-3.1-pro-preview"]),
      select:has(option[value="gemini-3.1-flash-lite-preview"]),
      select:has(option[value="gemini-3.1-flash-lite"]),
      select:has(option[value="gemini-3.5-flash"]),
      select:has(option[value="gemini-3.5-flash-lite"]),
      select:has(option[value="gemini-3.6-flash"]),
      select:has(option[value="gemini-3.7-flash"]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
