name: PR121 Production Alias Hotfix

on:
  push:
    branches:
      - feat/skill-runtime-foundation

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alias existing production JS path to new verified bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch jetwork-production-assets-pr121 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" assets
          cd assets
          test -f assets/index-DPY9SPKG.js
          cp assets/index-DPY9SPKG.js assets/index-D_LfQn2z.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-D_LfQn2z.js
          git commit -m "deploy: alias live JS path to XLSX hotfix bundle"
          git push origin HEAD:jetwork-production-assets-pr121
      - name: Remove one-shot workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feat/skill-runtime-foundation "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cleanup
          cd cleanup
          rm .github/workflows/pr121-production-alias-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot production alias hotfix"
          git push origin HEAD:feat/skill-runtime-foundation
