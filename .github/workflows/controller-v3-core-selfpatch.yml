name: Controller V3 Core Self Patch

on:
  push:
    branches:
      - controller-v3-interactions
    paths:
      - scripts/controller_v3_core_patch.py
      - .github/workflows/controller-v3-core-selfpatch.yml

permissions:
  contents: write

concurrency:
  group: controller-v3-core-selfpatch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout V3 branch
        uses: actions/checkout@v4
        with:
          ref: controller-v3-interactions
          fetch-depth: 0

      - name: Apply exact scoped patch
        run: python scripts/controller_v3_core_patch.py

      - name: Remove temporary self-patch files
        run: rm -f scripts/controller_v3_core_patch.py .github/workflows/controller-v3-core-selfpatch.yml

      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JETWORK Controller V3"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(controller-v3): persist Interactions state and emit real work events"
          git push origin HEAD:controller-v3-interactions
