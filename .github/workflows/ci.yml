name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run lint

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --reporter=json --outputFile=vitest-results.json
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostics-${{ github.sha }}
          path: vitest-results.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce unit test result
        if: steps.unit_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Reasoning Quality Golden Gate
        run: pnpm run verify:reasoning-golden

      - name: AI behavior regressions
        run: |
          pnpm run verify:ai-ba-engine
          pnpm run verify:ai-turn-decision
          pnpm run verify:deep-ba-assistant
          pnpm run verify:product-runtime
          pnpm run verify:document-quality

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://bpbbvjigostgrssnduhk.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_dzZaPjNDRK22UUwLXAiS4g_JerlvhHQ
          VITE_SINGLE_ASSISTANT_RUNTIME: 'true'
        run: pnpm run build

      - name: Upload production frontend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jetwork-production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  publish-production-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified production artifact
        uses: actions/download-artifact@v4
        with:
          name: jetwork-production-dist-${{ github.sha }}
          path: published

      - name: Rewrite asset URLs to immutable deployment branch
        shell: bash
        env:
          CDN_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@jetwork-production-assets
        run: |
          set -euo pipefail
          for css in published/assets/index-*.css; do
            sed -i "s#url(/assets/#url(${CDN_BASE}/assets/#g" "$css"
          done
          sed -i "s#src=\"/assets/#src=\"${CDN_BASE}/assets/#g; s#href=\"/assets/#href=\"${CDN_BASE}/assets/#g" published/index.html
          touch published/.nojekyll

      - name: Publish verified assets branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd published
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b jetwork-production-assets
          git add -A
          git commit -m "deploy: verified frontend assets ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:jetwork-production-assets