name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Reasoning Quality Golden Gate
        run: pnpm run verify:reasoning-golden

      - name: AI behavior regressions
        run: |
          pnpm run verify:ai-ba-engine
          pnpm run verify:ai-turn-decision
          pnpm run verify:deep-ba-assistant
          pnpm run verify:product-runtime
          pnpm run verify:document-quality

      - name: Production build
        run: pnpm run build
