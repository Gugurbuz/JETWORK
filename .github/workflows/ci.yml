name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: AI behavior regressions
        run: |
          pnpm run verify:ai-ba-engine
          pnpm run verify:ai-turn-decision
          pnpm run verify:deep-ba-assistant
          pnpm run verify:product-runtime
          pnpm run verify:document-quality

      - name: Production build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: E2E not configured
        if: env.E2E_USERNAME == '' || env.E2E_PASSWORD == ''
        run: echo "E2E secrets are not configured; browser smoke test skipped."

      - name: Checkout
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and browser
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Resolve Vercel deployment under test
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for attempt in $(seq 1 40); do
            deployment_ids=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/deployments?sha=${DEPLOYMENT_SHA}&per_page=10" \
              | jq -r '.[].id')

            for deployment_id in ${deployment_ids}; do
              environment_url=$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api}/deployments/${deployment_id}/statuses?per_page=10" \
                | jq -r '[.[] | select(.state == "success" and (.environment_url // "") != "")][0].environment_url // empty')
              if [[ -n "${environment_url}" ]]; then
                echo "E2E_BASE_URL=${environment_url}" >> "${GITHUB_ENV}"
                echo "Testing deployment: ${environment_url}"
                exit 0
              fi
            done
            echo "Waiting for Vercel deployment for ${DEPLOYMENT_SHA} (attempt ${attempt}/40)..."
            sleep 10
          done
          echo "No successful Vercel deployment URL found for ${DEPLOYMENT_SHA}." >&2
          exit 1

      - name: Browser smoke test
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        run: pnpm run test:e2e
