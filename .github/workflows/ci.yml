name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Reasoning Quality Golden Gate
        run: pnpm run verify:reasoning-golden

      - name: AI behavior regressions
        run: |
          pnpm run verify:ai-ba-engine
          pnpm run verify:ai-turn-decision
          pnpm run verify:deep-ba-assistant
          pnpm run verify:product-runtime
          pnpm run verify:document-quality

      - name: Production build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VITE_SUPABASE_URL: https://bpbbvjigostgrssnduhk.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_dzZaPjNDRK22UUwLXAiS4g_JerlvhHQ
    steps:
      - name: E2E not configured
        if: env.E2E_USERNAME == '' || env.E2E_PASSWORD == ''
        run: echo "E2E secrets are not configured; browser and live reasoning canaries skipped."

      - name: Checkout
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and browser
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Reasoning live canaries against PR core
        if: github.event_name == 'pull_request' && env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        env:
          REASONING_CANARY_ENDPOINT: openai-assistant-golden-canary
          REASONING_CANARY_OUTPUT: evaluation/results/reasoning-live-canary.json
        run: pnpm exec tsx scripts/run-reasoning-live-canary.ts

      - name: Upload reasoning canary report
        if: always() && github.event_name == 'pull_request' && env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-live-canary
          path: evaluation/results/reasoning-live-canary.json
          if-no-files-found: ignore

      - name: Browser smoke test against branch build
        if: env.E2E_USERNAME != '' && env.E2E_PASSWORD != ''
        run: pnpm run test:e2e
