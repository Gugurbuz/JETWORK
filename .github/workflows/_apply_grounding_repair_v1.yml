name: Apply Grounding Repair v1

on:
  push:
    branches:
      - fix/grounding-repair-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[grounding-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grounding-repair-v1
          fetch-depth: 0
      - name: Apply bounded repair patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('supabase/functions/openai-assistant-core-v2/implementation.ts')
          core = core_path.read_text()

          old = """      let planForArtifactCompletion: ReasoningPlan | null = null
      let turnCompleted = false
"""
          new = """      let planForArtifactCompletion: ReasoningPlan | null = null
      let turnCompleted = false
      let groundingRepairAttempted = false
"""
          if old not in core:
              raise SystemExit('core state anchor not found')
          core = core.replace(old, new, 1)

          old = """        for (let round = 0; round <= MAX_TOOL_ROUNDS; round += 1) {
          const mustSynthesize = round === MAX_TOOL_ROUNDS
"""
          new = """        let maxControllerRound = MAX_TOOL_ROUNDS
        for (let round = 0; round <= maxControllerRound; round += 1) {
          const mustSynthesize = round === maxControllerRound
"""
          if old not in core:
              raise SystemExit('controller loop anchor not found')
          core = core.replace(old, new, 1)

          old = """            const groundingCoverage = evaluateGroundedTechnicalClaims({ text: roundText, plan, sources, toolResults: [...toolResultCache.values()], currentUserText: message })
            const groundingBlocked = shouldFailClosedGroundedAnswer({ plan, coverage: groundingCoverage })
            if (groundingBlocked) {
              console.warn('ASSISTANT_GROUNDING_COVERAGE_BLOCKED', JSON.stringify({
                messageId, unsupportedIdentifiers: groundingCoverage.unsupportedIdentifiers,
                messageTextMismatchCount: groundingCoverage.messageTextMismatches.length,
                verifiedKnowledgeEvidence: groundingCoverage.verifiedKnowledgeEvidence,
              }))
              roundText = groundingFailureText()
              usage = addUsage(usage, {
                grounding_fail_closed: 1, grounding_claim_coverage_blocked: 1,
                grounding_unsupported_identifiers: groundingCoverage.unsupportedIdentifiers.length,
                grounding_message_text_mismatches: groundingCoverage.messageTextMismatches.length,
                grounding_unverified_provider_text_discarded: 1,
              })
              emitStatus('verifying', 'Kanıt kapsamı dışında kalan teknik iddialar engellendi')
            }
"""
          new = """            const groundingCoverage = evaluateGroundedTechnicalClaims({ text: roundText, plan, sources, toolResults: [...toolResultCache.values()], currentUserText: message })
            const groundingBlocked = shouldFailClosedGroundedAnswer({ plan, coverage: groundingCoverage })
            const mayRequestGroundingRepair = AGENTIC_CONTROLLER_ENABLED
              && groundingBlocked
              && !groundingRepairAttempted
              && !roundTextStreamed
              && totalToolCalls < MAX_TOOL_CALLS
            if (mayRequestGroundingRepair) {
              groundingRepairAttempted = true
              // Reserve at most one tool-capable repair round plus one final synthesis round.
              // The runtime does not choose a tool or formulate a query; it only returns
              // the failed verification observation to the same Controller.
              maxControllerRound = Math.min(MAX_TOOL_ROUNDS + 2, Math.max(maxControllerRound, round + 2))
              const verifiedSourceCanonicals = sources
                .filter(source => source.sourceType !== 'web' && source.canonicalKey)
                .map(source => String(source.canonicalKey))
                .slice(0, 24)
              runItems.push({
                role: 'developer',
                content: [
                  '[GROUNDING_REPAIR_OBSERVATION]',
                  'Bir önceki aday yanıt final olarak reddedildi. Bu observation bir semantic plan değildir ve sıradaki aracı seçmez.',
                  `unsupportedIdentifiers=${JSON.stringify(groundingCoverage.unsupportedIdentifiers)}`,
                  `messageTextMismatches=${JSON.stringify(groundingCoverage.messageTextMismatches)}`,
                  `unsupportedClaims=${JSON.stringify(groundingCoverage.unsupportedClaims || [])}`,
                  `verifiedSourceCanonicals=${JSON.stringify(verifiedSourceCanonicals)}`,
                  'Mevcut current-turn function_call_output observationlarını yeniden değerlendir. Kanıt soruyu cevaplıyorsa yalnız doğrulanmış sonucu sentezle; doğrulanmamış identifier veya davranış ekleme.',
                  'Kullanıcı exact implementasyon istiyorsa ve doğrulanan nesne yalnız structural endpoint/call relation ise tam gövde varmış gibi yazma; nesne adını koruyarak tam implementasyon kaynağının bulunmadığını açıkça söyle.',
                  'Kullanıcı exact mesaj/ABAP satırı istiyorsa ve exact mesaj kaydı doğrulanmışsa, gerekiyorsa literal satırı doğrulamak için görünür knowledge capabilitylerinden hangisinin uygun olduğuna sen karar ver.',
                  'Sıradaki capability/tool çağrısı, sorgu, ek araştırma veya final cevap kararı yalnız Controller LLM olarak sana aittir.',
                ].join('\\n'),
              })
              usage = addUsage(usage, {
                grounding_repair_requested: 1,
                grounding_repair_unsupported_identifiers: groundingCoverage.unsupportedIdentifiers.length,
                grounding_repair_unsupported_claims: groundingCoverage.unsupportedClaims?.length || 0,
              })
              emitStatus('verifying', 'Grounding kontrolü aynı Controller’a düzeltme observationı olarak geri verildi')
              continue
            }
            if (groundingBlocked) {
              console.warn('ASSISTANT_GROUNDING_COVERAGE_BLOCKED', JSON.stringify({
                messageId, unsupportedIdentifiers: groundingCoverage.unsupportedIdentifiers,
                messageTextMismatchCount: groundingCoverage.messageTextMismatches.length,
                verifiedKnowledgeEvidence: groundingCoverage.verifiedKnowledgeEvidence,
              }))
              roundText = groundingFailureText()
              usage = addUsage(usage, {
                grounding_fail_closed: 1, grounding_claim_coverage_blocked: 1,
                grounding_unsupported_identifiers: groundingCoverage.unsupportedIdentifiers.length,
                grounding_message_text_mismatches: groundingCoverage.messageTextMismatches.length,
                grounding_unverified_provider_text_discarded: 1,
              })
              emitStatus('verifying', 'Kanıt kapsamı dışında kalan teknik iddialar engellendi')
            }
"""
          if old not in core:
              raise SystemExit('grounding finalization anchor not found')
          core = core.replace(old, new, 1)
          core_path.write_text(core)

          guard_path = Path('supabase/functions/_shared/groundingGuard.ts')
          guard = guard_path.read_text()
          old = """const exactMessageTextRequested = (text: string) => EXACT_MESSAGE_TEXT_REQUEST_PATTERN.test(normalizeText(text))

const evidenceGapIdentifiers"""
          new = """const exactMessageTextRequested = (text: string) => EXACT_MESSAGE_TEXT_REQUEST_PATTERN.test(normalizeText(text))

const requestedNumericMessageNumber = (text: string) => {
  const normalized = normalizeText(text)
  const leading = normalized.match(/\\b(\\d{2,4})\\b(?=[^\\n]{0,48}\\b(?:nolu|numarali|mesaj|hata)\\b)/i)
  const trailing = normalized.match(/\\b(?:mesaj|hata)[^\\n]{0,48}\\b(\\d{2,4})\\b/i)
  return clean(leading?.[1] || trailing?.[1], 8)
}

const evidenceGapIdentifiers"""
          if old not in guard:
              raise SystemExit('numeric message helper anchor not found')
          guard = guard.replace(old, new, 1)

          old = """  const exactTechnicalFactLookup = exactTechnicalFactLookupRequested(suppliedText, suppliedIdentifiers)
"""
          new = """  const requestedMessageNumber = requestedNumericMessageNumber(suppliedText)
  const exactTechnicalFactLookup = exactTechnicalFactLookupRequested(suppliedText, suppliedIdentifiers)
    || Boolean(requestedMessageNumber)
"""
          if old not in guard:
              raise SystemExit('exact lookup anchor not found')
          guard = guard.replace(old, new, 1)

          old = """  const unsupportedClaims = unsupportedExactBehaviorClaims({
    responseText: input.text,
    suppliedIdentifiers,
    verifiedEvidence: verifiedEvidenceText(input.sources, verifiedResults),
    exactTechnicalFactLookup,
  })
"""
          new = """  const unsupportedClaims = unsupportedExactBehaviorClaims({
    responseText: input.text,
    suppliedIdentifiers,
    verifiedEvidence: verifiedEvidenceText(input.sources, verifiedResults),
    exactTechnicalFactLookup,
  })
  const resolvedNumericMessageGap = Boolean(
    requestedMessageNumber
      && [...titles.keys()].some(identifier => identifier.endsWith(`-${requestedMessageNumber}`))
      && isEvidenceGapResponse(input.text)
  )
  if (resolvedNumericMessageGap) {
    unsupportedClaims.push(`verified_message_number:${requestedMessageNumber}:response_reported_gap`)
  }
"""
          if old not in guard:
              raise SystemExit('unsupported claims anchor not found')
          guard = guard.replace(old, new, 1)
          guard_path.write_text(guard)

          test_path = Path('src/services/__tests__/groundingRepairV1.test.ts')
          test_path.write_text("""import { readFileSync } from 'node:fs'
import { describe, expect, it } from 'vitest'
import { evaluateGroundedTechnicalClaims } from '../../../supabase/functions/_shared/groundingGuard'

const coreSource = readFileSync(new URL('../../../supabase/functions/openai-assistant-core-v2/implementation.ts', import.meta.url), 'utf8')

describe('bounded grounding repair v1', () => {
  it('returns failed grounding to the same Controller once without selecting a tool', () => {
    expect(coreSource).toContain('let groundingRepairAttempted = false')
    expect(coreSource).toContain('let maxControllerRound = MAX_TOOL_ROUNDS')
    expect(coreSource).toContain('[GROUNDING_REPAIR_OBSERVATION]')
    expect(coreSource).toContain('grounding_repair_requested')
    expect(coreSource).toContain('maxControllerRound = Math.min(MAX_TOOL_ROUNDS + 2')
    const repairStart = coreSource.indexOf('const mayRequestGroundingRepair')
    const repairEnd = coreSource.indexOf('if (groundingBlocked) {', repairStart)
    const repairBlock = coreSource.slice(repairStart, repairEnd)
    expect(repairBlock).not.toContain("runKnowledgeTool('")
    expect(repairBlock).not.toContain("toolName: 'get_")
    expect(coreSource).toContain('roundText = groundingFailureText()')
  })

  it('rejects a generic evidence-gap answer when the requested numeric message was actually verified', () => {
    const evidence = {
      output: JSON.stringify({
        securityNotice: 'VERIFIED_KNOWLEDGE_EVIDENCE',
        citationReady: true,
        records: [{ canonicalKey: 'message:zcrm_cost-111', objectType: 'message', title: 'ZCRM_COST-111 — Ön ödeme günü zorunludur.' }],
      }),
      sources: [{ sourceType: 'knowledge', canonicalKey: 'message:zcrm_cost-111', objectType: 'message', title: 'ZCRM_COST-111 — Ön ödeme günü zorunludur.' }],
      summary: { citationReady: true },
    }
    const coverage = evaluateGroundedTechnicalClaims({
      text: '111 numaralı mesaj için yeterli güvenilir kaynak bulunamadı; mesaj sınıfı belirtilmedi.',
      plan: { knowledgeRequired: true, enterpriseGroundingRequired: true },
      sources: evidence.sources,
      toolResults: [evidence],
      currentUserText: '111 nolu hatanın abap kodunu ver',
    })
    expect(coverage.ok).toBe(false)
    expect(coverage.unsupportedClaims).toContain('verified_message_number:111:response_reported_gap')
  })
})
""")
          PY

          rm -f .github/workflows/_apply_grounding_repair_v1.yml
          git config user.name "jetwork-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/openai-assistant-core-v2/implementation.ts supabase/functions/_shared/groundingGuard.ts src/services/__tests__/groundingRepairV1.test.ts .github/workflows/_apply_grounding_repair_v1.yml
          git commit -m "fix(agent): add bounded grounding repair [grounding-repair-applied]"
          git push origin HEAD:fix/grounding-repair-v1
