name: Capability V2 text compatibility
on:
  push:
    branches:
      - feat/capability-system-v2-master
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capability-system-v2-master
      - name: Patch chat-only text compatibility
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/services/assistantRuntimeClient.ts')
          text = path.read_text()
          old = """  const chatAttachments = attachments.filter(candidate => (\n    candidate.purpose === 'chat_only'\n    && !isActionableExecutionAttachment(candidate)\n  ));\n"""
          new = """  const chatAttachments = attachments.filter(candidate => {\n    if (candidate.purpose !== 'chat_only') return false;\n    const mimeType = String(candidate.mimeType || '').toLocaleLowerCase('en-US');\n    const explicitlyTextReadable = mimeType.startsWith('text/') || mimeType === 'application/json';\n    return explicitlyTextReadable || !isActionableExecutionAttachment(candidate);\n  });\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one chat attachment filter, found {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/assistantRuntimeClient.ts
          git commit -m "fix: preserve explicit chat-only text attachments"
          git push origin HEAD:feat/capability-system-v2-master
