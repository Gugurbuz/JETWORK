name: Remove runtime semantic grounding
on:
  push:
    branches: ["fix/remove-runtime-semantic-grounding"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-runtime-semantic-grounding
          fetch-depth: 0
      - run: python scripts/tmp_remove_runtime_semantic_grounding.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/openai-assistant-core-v2/implementation.ts src/services/__tests__
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(agent): remove runtime semantic grounding authority"
          git push origin HEAD:fix/remove-runtime-semantic-grounding
