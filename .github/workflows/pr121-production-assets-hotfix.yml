name: PR121 Production Assets Hotfix

on:
  push:
    branches:
      - feat/skill-runtime-foundation

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build verified frontend
        env:
          VITE_SUPABASE_URL: https://bpbbvjigostgrssnduhk.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_dzZaPjNDRK22UUwLXAiS4g_JerlvhHQ
          VITE_SINGLE_ASSISTANT_RUNTIME: 'true'
        run: pnpm run build
      - name: Rewrite asset URLs
        shell: bash
        env:
          CDN_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@jetwork-production-assets-pr121
        run: |
          set -euo pipefail
          for css in dist/assets/index-*.css; do
            sed -i "s#url(/assets/#url(${CDN_BASE}/assets/#g" "$css"
          done
          sed -i "s#src=\"/assets/#src=\"${CDN_BASE}/assets/#g; s#href=\"/assets/#href=\"${CDN_BASE}/assets/#g" dist/index.html
          touch dist/.nojekyll
      - name: Publish frozen PR121 assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b jetwork-production-assets-pr121
          git add -A
          git commit -m "deploy: XLSX hotfix assets ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:jetwork-production-assets-pr121
      - name: Remove one-shot workflow from feature branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feat/skill-runtime-foundation "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cleanup
          cd cleanup
          rm .github/workflows/pr121-production-assets-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot XLSX asset publisher"
          git push origin HEAD:feat/skill-runtime-foundation
