name: BA analysis intelligence fix

on:
  push:
    branches: ["fix/ba-analysis-intelligence"]
    paths: [".github/workflows/ba-analysis-intelligence-fix.yml"]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Apply semantic BA fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          semantic = 'supabase/functions/_shared/semanticOrchestrator.ts'
          replace_once(
              semantic,
              "const TECHNICAL_ENTITY_PATTERN = /\\b(?:Z[A-Z0-9_]{2,}(?:[-_/][A-Z0-9_]+)*|CHECK_[A-Z0-9_]+|NINJA_[A-Z0-9_]+|[A-Z][A-Z0-9_]{2,}-\\d{2,4})\\b/g",
              "const STRUCTURED_TECHNICAL_ENTITY_PATTERN = /\\b(?:Z[A-Za-z0-9_]{2,}(?:[-_/][A-Za-z0-9_]+)+|Z[A-Za-z_]*\\d[A-Za-z0-9_/-]*|CHECK_[A-Za-z0-9_]+|NINJA_[A-Za-z0-9_]+|[A-Z][A-Z0-9_]{2,}-\\d{2,4})\\b/g\nconst PLAIN_UPPERCASE_Z_ENTITY_PATTERN = /\\bZ[A-Z]{2,8}\\b/g"
          )
          replace_once(
              semantic,
              "const extractTechnicalEntities = (value: string) => unique([...value.toLocaleUpperCase('en-US').matchAll(TECHNICAL_ENTITY_PATTERN)].map(match => match[0]), 10)",
              "const extractTechnicalEntities = (value: string) => unique([\n  ...[...value.matchAll(STRUCTURED_TECHNICAL_ENTITY_PATTERN)].map(match => match[0].toLocaleUpperCase('en-US')),\n  ...[...value.matchAll(PLAIN_UPPERCASE_Z_ENTITY_PATTERN)].map(match => match[0]),\n], 10)"
          )

          energisa = 'supabase/functions/openai-assistant-enerjisa-docx/index.ts'
          replace_once(
              energisa,
              "    creativeMode: false,\n    enumerationTarget: undefined,\n    goal: semantic.plan.conversationState?.resolvedRequest || message,\n    steps: [\n      {\n        id: 'synthesize-enerjisa-analysis',\n        label: 'Konuşma bağlamı ve varsa doğrulanmış kanıtlarla Enerjisa iş analizini sentezle',\n        toolHint: semantic.plan.knowledgeRequired ? 'knowledge' as const : 'synthesis' as const,\n        successCriteria: 'Bilinmeyen detaylar uydurulmaz; [AÇIK KONU] olarak işaretlenir.',\n      },",
              "    creativeMode: false,\n    enumerationTarget: undefined,\n    goal: semantic.plan.conversationState?.resolvedRequest || message,\n    knowledgeRequired: true,\n    enterpriseGroundingRequired: true,\n    webMode: 'none' as const,\n    verificationRequired: false,\n    evidenceQueries: [\n      clean(`Kurumsal mevcut durum, benzer ürün/süreç, platform-sistem sahipliği, entegrasyon ve veri kaynakları: ${message}`, 1_800),\n    ],\n    steps: [\n      {\n        id: 'research-enterprise-current-state',\n        label: 'JetWork kurumsal kaynaklarında mevcut süreç, benzer ürünler ve iş kurallarını araştır',\n        toolHint: 'knowledge' as const,\n        successCriteria: 'Kurumsal kaynaklar gerçekten aranır; bulunan kanıtlar ile kullanıcı talebi birbirinden ayrılır.',\n      },\n      {\n        id: 'analyze-platform-impact',\n        label: 'Platform, sistem sahipliği, entegrasyon sınırları ve veri kaynakları için etki analizi yap',\n        toolHint: 'knowledge' as const,\n        successCriteria: 'Platform kararı kanıta dayanır; çözülemeyen sistem sahipliği kararları [AÇIK KONU] olarak bırakılır.',\n      },\n      {\n        id: 'synthesize-enerjisa-analysis',\n        label: 'Talep dokümanı ile doğrulanmış kurumsal kanıtları birleştirerek Enerjisa iş analizini sentezle',\n        toolHint: 'synthesis' as const,\n        successCriteria: 'Bilinmeyen detaylar uydurulmaz; kritik belirsizlikler karar gerektiren soru veya [AÇIK KONU] olarak işaretlenir.',\n      },"
          )

          routing = 'supabase/functions/_shared/documentArtifactRouting.ts'
          replace_once(
              routing,
              "Başlık/Açıklama tablosunda en az Sistem, Modül, Etkilenen Süreç, Etkilenen Roller, Varsayımlar ve Kısıtlar.\n## 2. KISALTMALAR",
              "Başlık/Açıklama tablosunda en az Sistem, Modül, Etkilenen Süreç, Etkilenen Roller, Varsayımlar ve Kısıtlar.\n### 1.1. Platform ve Sistem Etki Analizi\n| Platform/Sistem | Mevcut Rol | Talep Etkisi | Kurumsal Kanıt | Durum | tablosunu kullan. Platform veya system-of-record bilgisi doğrulanamıyorsa tahmin etme; [AÇIK KONU] yaz.\n## 2. KISALTMALAR"
          )
          replace_once(
              routing,
              "### 6.3. Süreç Etkileri\nGerekli olduğunda test senaryolarını",
              "### 6.3. Süreç Etkileri\n### 6.4. Açık Konular ve Karar Gerektiren Sorular\nÖnce kurumsal kaynakta araştır. Araştırmayla çözülemeyen ve çözüm mimarisini, platform sahipliğini, faturalama/tahsilat akışını veya entegrasyon sınırını materially etkileyen konuları net sorular halinde yaz. Kullanıcıdan cevap almadan bunları gerçek karar gibi doldurma.\nGerekli olduğunda test senaryolarını"
          )
          replace_once(
              routing,
              "- Yeterli bağlam varsa sırf bazı alanlar bilinmiyor diye dokümanı durdurma; kullanılabilir taslağı üret ve eksikleri [AÇIK KONU] bırak.\n- Son kullanıcı metninde \"Canvas\" ifadesini kullanma.",
              "- Talep dokümanını tek başına mevcut sistem gerçeği sayma: mevcut durum, platform sahipliği ve entegrasyon iddialarını önce kurumsal kaynakta doğrula.\n- Yeterli bağlam varsa sırf bazı alanlar bilinmiyor diye dokümanı durdurma; kullanılabilir taslağı üret ve eksikleri [AÇIK KONU] bırak.\n- Artifact üretildikten sonraki kısa sohbet mesajında varsa en fazla 5 kritik karar sorusunu kullanıcıya açıkça sor.\n- Son kullanıcı metninde \"Canvas\" ifadesini kullanma."
          )

          core = 'supabase/functions/openai-assistant-core-v2/implementation.ts'
          replace_once(
              core,
              "      const skillToolResultCache = new Map<string, SkillToolExecution>()\n      const loadedSkillKeys = new Set<string>()\n      let turnCompleted = false",
              "      const skillToolResultCache = new Map<string, SkillToolExecution>()\n      const loadedSkillKeys = new Set<string>()\n      const semanticArtifactRequired = () => planForArtifactCompletion?.executionMode === 'artifact'\n      let planForArtifactCompletion: ReasoningPlan | null = null\n      let turnCompleted = false"
          )
          # Move the plan assignment immediately after planning.
          replace_once(
              core,
              "        const plan = planned.plan\n        const geminiNativeWebPlanned",
              "        const plan = planned.plan\n        planForArtifactCompletion = plan\n        const geminiNativeWebPlanned"
          )
          replace_once(
              core,
              "              && plan.intent !== 'sap_diagnosis'\n              && !hasExactCustomIdentifierInRequest",
              "              && plan.intent !== 'sap_diagnosis'\n              && plan.executionMode !== 'artifact'\n              && !hasExactCustomIdentifierInRequest"
          )
          replace_once(
              core,
              "          if (!functionCalls.length) {\n            if (!roundText.trim()) throw new Error(`${activeProvider} completed without a user-visible answer.`)",
              "          if (!functionCalls.length) {\n            if (semanticArtifactRequired() && generatedArtifacts.size === 0) {\n              if (!mustSynthesize && totalToolCalls < MAX_TOOL_CALLS) {\n                runItems.push({\n                  role: 'developer',\n                  content: 'SEMANTIC_ARTIFACT_REQUIRED: Semantic plan bu turn için gerçek artifact teslimini zorunlu kılıyor. Kaynak metindeki kelimelerden yeni intent çıkarma; planın istediği artifact capability/executorunu çağır. Executor artifact döndürmeden final verme.',\n                })\n                usage = addUsage(usage, { semantic_artifact_completion_guard: 1 })\n                emitStatus('synthesizing', 'Planlanan dosya çıktısı oluşturuluyor...')\n                continue\n              }\n              throw new Error('Required artifact executor did not produce a file.')\n            }\n            if (!roundText.trim()) throw new Error(`${activeProvider} completed without a user-visible answer.`)"
          )

          test = Path('src/services/__tests__/baAnalysisIntelligenceRegression.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'\nimport { buildSemanticExecutionPlan } from '../../../supabase/functions/_shared/semanticOrchestrator.ts'\n\nconst coreSource = readFileSync(new URL('../../../supabase/functions/openai-assistant-core-v2/implementation.ts', import.meta.url), 'utf8')\nconst enerjisaSource = readFileSync(new URL('../../../supabase/functions/openai-assistant-enerjisa-docx/index.ts', import.meta.url), 'utf8')\nconst routingSource = readFileSync(new URL('../../../supabase/functions/_shared/documentArtifactRouting.ts', import.meta.url), 'utf8')\n\ndescribe('BA analysis intelligence regression', () => {\n  it('does not promote ordinary Turkish z-words into technical entities', async () => {\n    const result = await buildSemanticExecutionPlan({\n      provider: 'openai', model: 'gpt-5.6-sol',\n      message: 'Bu süreç üzerinden zamanında düzenlenmesi gereken teklif akışını analiz et. ZCRM_COST_REPORT ile ilişkili noktaları da kontrol et.',\n      conversation: [],\n    })\n    const entities = result.plan.conversationState?.activeEntities || []\n    expect(entities).toContain('ZCRM_COST_REPORT')\n    expect(entities).not.toContain('ZERINDEN')\n    expect(entities).not.toContain('ZAMANDA')\n    expect(entities).not.toContain('ZENLENMESI')\n  })\n\n  it('forces Enerjisa BA specialization to research enterprise current state and platform impact', () => {\n    expect(enerjisaSource).toContain('knowledgeRequired: true')\n    expect(enerjisaSource).toContain('enterpriseGroundingRequired: true')\n    expect(enerjisaSource).toContain("id: 'research-enterprise-current-state'")\n    expect(enerjisaSource).toContain("id: 'analyze-platform-impact'")\n    expect(enerjisaSource).toContain('platform-sistem sahipliği')\n  })\n\n  it('keeps artifact completion semantic and executor-backed without raw-message artifact regex', () => {\n    expect(coreSource).toContain('semanticArtifactRequired')\n    expect(coreSource).toContain('SEMANTIC_ARTIFACT_REQUIRED')\n    expect(coreSource).toContain('generatedArtifacts.size === 0')\n    expect(coreSource).toContain("plan.executionMode !== 'artifact'")\n    expect(coreSource).not.toContain('spreadsheetCreateRequested')\n    expect(coreSource).not.toContain('artifactMutationRequested')\n  })\n\n  it('requires platform analysis and unresolved decision questions in Enerjisa document profile', () => {\n    expect(routingSource).toContain('Platform ve Sistem Etki Analizi')\n    expect(routingSource).toContain('Açık Konular ve Karar Gerektiren Sorular')\n    expect(routingSource).toContain('önce kurumsal kaynakta doğrula')\n    expect(routingSource).toContain('en fazla 5 kritik karar sorusunu')\n  })\n})\n""")

      - name: Run focused regression tests
        run: npx vitest run src/services/__tests__/baAnalysisIntelligenceRegression.test.ts src/services/__tests__/capabilitySystemV2.test.ts src/services/__tests__/reasoningAgentLoopV3.test.ts src/services/__tests__/pythonDocxArtifactWorker.test.ts
      - run: npm run verify:assistant-runtime
      - name: Commit validated patch
        run: |
          rm .github/workflows/ba-analysis-intelligence-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce grounded BA analysis execution"
          git push origin HEAD:${GITHUB_REF_NAME}
