name: Reasoning Live Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/openai-assistant-v2/**'
      - 'supabase/functions/openai-assistant-core-v2/**'
      - 'supabase/functions/_shared/**'
      - 'scripts/run-reasoning-production-canary.ts'
      - '.github/workflows/reasoning-live-canary.yml'

permissions:
  contents: read

concurrency:
  group: reasoning-live-canary-production
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VITE_SUPABASE_URL: https://bpbbvjigostgrssnduhk.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_dzZaPjNDRK22UUwLXAiS4g_JerlvhHQ
      REASONING_CANARY_ENDPOINT: openai-assistant-v2
    steps:
      - name: Require canary credentials
        run: |
          test -n "$E2E_USERNAME" || (echo "E2E_USERNAME is not configured" && exit 1)
          test -n "$E2E_PASSWORD" || (echo "E2E_PASSWORD is not configured" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production continuity canary
        run: pnpm exec tsx scripts/run-reasoning-production-canary.ts
