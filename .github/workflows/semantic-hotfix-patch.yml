name: Apply Semantic Planner Compatibility Patch

on:
  push:
    branches:
      - fix/reasoning-semantic-model-and-failure-diagnostics
    paths:
      - '.github/workflows/semantic-hotfix-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reasoning-semantic-model-and-failure-diagnostics
          fetch-depth: 0
      - name: Patch semantic Gemini compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/_shared/semanticOrchestrator.ts')
          text = path.read_text()
          old_model = "const GEMINI_SEMANTIC_MODEL = 'gemini-3-flash-preview'"
          new_model = "const GEMINI_SEMANTIC_MODEL = 'gemini-3.1-flash-lite-preview'"
          old_thinking = "thinkingConfig: { thinkingLevel: 'low' }"
          new_thinking = "thinkingConfig: { thinkingLevel: 'LOW' }"
          if old_model not in text:
              raise SystemExit('Expected semantic model marker not found')
          if old_thinking not in text:
              raise SystemExit('Expected thinking level marker not found')
          text = text.replace(old_model, new_model, 1)
          text = text.replace(old_thinking, new_thinking, 1)
          path.write_text(text)
          PY
      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/semanticOrchestrator.ts
          git commit -m "fix: use supported Gemini semantic planner contract"
          git push origin HEAD:fix/reasoning-semantic-model-and-failure-diagnostics
