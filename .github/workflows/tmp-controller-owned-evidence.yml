name: Controller Owned Evidence Patch
on:
  push:
    branches: ["fix/controller-owned-evidence-continuity"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controller-owned-evidence-continuity
          fetch-depth: 0
      - run: python scripts/tmp_patch_controller_owned_evidence.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/openai-assistant-core-v2/implementation.ts supabase/functions/_shared/agent/controllerPolicy.ts supabase/functions/_shared/context/resolvedContext.ts src/services/__tests__/controllerOwnedEvidenceContinuity.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(agent): make evidence continuity controller-owned"
          git push origin HEAD:fix/controller-owned-evidence-continuity
