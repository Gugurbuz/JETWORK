name: Runtime stream branch typecheck unblock

on:
  push:
    branches:
      - fix/runtime-stream-stabilization-v2

permissions:
  contents: write

jobs:
  patch-existing-main-typecheck-blocker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-stream-stabilization-v2
          fetch-depth: 0
      - name: Narrow Gemini grounding query type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/_shared/modelProvidersLegacy.ts')
          text = path.read_text()
          old = "  return [...new Set(queries.map((query: unknown) => String(query || '').trim()).filter(Boolean))].slice(0, 12)"
          new = "  const normalizedQueries: string[] = queries\n    .map((query: unknown) => String(query || '').trim())\n    .filter((query: string) => query.length > 0)\n  return [...new Set<string>(normalizedQueries)].slice(0, 12)"
          if old not in text:
              raise SystemExit('Expected groundingSearchQueries expression was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit narrow type fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/modelProvidersLegacy.ts
          git commit -m "fix: narrow Gemini grounding query type"
          git push origin HEAD:fix/runtime-stream-stabilization-v2
