name: PR121 Grounding Hotfix

on:
  push:
    branches:
      - feat/skill-runtime-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/skill-runtime-foundation
          fetch-depth: 0

      - name: Apply exact technical grounding patch
        run: python .github/scripts/pr121_grounding_hotfix.py

      - name: Remove one-shot patch files and commit
        run: |
          set -euo pipefail
          rm .github/workflows/pr121-grounding-hotfix.yml
          rm .github/scripts/pr121_grounding_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: require evidence for exact enterprise fact lookups"
          git push origin HEAD:feat/skill-runtime-foundation
