name: Contextual BA artifact fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'retry contextual BA artifact validation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          sem = Path('supabase/functions/_shared/semanticOrchestrator.ts')
          s = sem.read_text()
          s = s.replace("knowledgeRequired: false,\n        webMode: 'none' as const,", "knowledgeRequired: true,\n        webMode: 'none' as const,", 1)
          s = s.replace("knowledgeRequired: userProvidedRequirements ? false : route.knowledgeRequired,\n    enterpriseGroundingRequired: false,", "knowledgeRequired: userProvidedRequirements ? true : route.knowledgeRequired,\n    enterpriseGroundingRequired: userProvidedRequirements,", 1)
          s = s.replace("enterpriseGroundingRequired: false,\n      // Gemini keeps provider lock", "enterpriseGroundingRequired: inputPlan.enterpriseGroundingRequired === true,\n      // Gemini keeps provider lock", 1)
          s = s.replace("Kullanıcının verdiği gereksinimler doğrudan analiz edilir; yalnız gerçekten eksik dış fact için capability kullanılır.", "Kullanıcı gereksinimleri talep kanıtıdır; mevcut sistem, benzer ürün, sistem sahipliği ve entegrasyon iddiaları için kurumsal knowledge kanıtı kullanılır.", 1)
          sem.write_text(s)

          router = Path('supabase/functions/openai-assistant-v2-entry-router/index.ts')
          r = router.read_text()
          marker = "async function hasRecentEnerjisaAnalysisDocx(client: ReturnType<typeof createClient>, workspaceId: string) {\n"
          helper = '''async function loadRecentArtifactContext(
            client: ReturnType<typeof createClient>,
            workspaceId: string,
            messageId: string,
          ) {
            if (!workspaceId) return { priorUser: '', recentContext: '' }
            const { data, error } = await client
              .from('messages')
              .select('id,role,text,created_at')
              .eq('workspace_id', workspaceId)
              .in('role', ['user', 'model'])
              .order('created_at', { ascending: false })
              .limit(8)
            if (error) {
              console.warn('Artifact continuation context lookup failed:', error.message)
              return { priorUser: '', recentContext: '' }
            }
            const rows = (data || []).filter(row => String(row.id || '') !== messageId)
            const priorUserRow = rows.find(row => row.role === 'user' && clean(row.text, 26_000))
            const priorUser = priorUserRow ? clean(priorUserRow.text, 26_000) : ''
            const recentContext = [...rows]
              .reverse()
              .slice(-4)
              .map(row => `${row.role === 'user' ? 'user' : 'assistant'}: ${clean(row.text, 4_000)}`)
              .filter(Boolean)
              .join('\\n\\n')
            return { priorUser, recentContext }
          }

          '''
          if 'loadRecentArtifactContext' not in r:
              r = r.replace(marker, helper + marker)
          r = r.replace("  const routeDecision = classifyDocumentArtifactRequest(message)\n  const revisionCandidate = isDocumentRevisionRequest(message)\n", "  const routeDecision = classifyDocumentArtifactRequest(message)\n  const artifactContext = !routeDecision.artifactRoute\n    ? await loadRecentArtifactContext(client, workspaceId, messageId)\n    : { priorUser: '', recentContext: '' }\n  const contextualDecision = !routeDecision.artifactRoute && artifactContext.recentContext\n    ? classifyDocumentArtifactRequest(`${artifactContext.recentContext}\\n\\ncurrent user request: ${message}`)\n    : routeDecision\n  const contextualEnerjisaCreation = !routeDecision.enerjisaAnalysisDocx\n    && contextualDecision.enerjisaAnalysisDocx\n    && Boolean(artifactContext.priorUser)\n  const revisionCandidate = isDocumentRevisionRequest(message)\n", 1)
          r = r.replace("  const enerjisaAnalysisDocx = routeDecision.enerjisaAnalysisDocx || revisionOfEnerjisaAnalysis\n", "  const enerjisaAnalysisDocx = routeDecision.enerjisaAnalysisDocx || contextualEnerjisaCreation || revisionOfEnerjisaAnalysis\n", 1)
          r = r.replace("  const upstreamPayload = groundedRequirement\n    ? { ...payload, message: applyRequirementGroundingGuard(message) }\n    : payload\n", "  const contextualArtifactMessage = contextualEnerjisaCreation\n    ? `${artifactContext.priorUser}\\n\\n[KULLANICI DEVAM TALİMATI]\\n${message}`\n    : message\n  const upstreamPayload = groundedRequirement\n    ? { ...payload, message: applyRequirementGroundingGuard(message) }\n    : contextualEnerjisaCreation\n      ? { ...payload, message: contextualArtifactMessage }\n      : payload\n", 1)
          r = r.replace("      ? 'enerjisa-analysis-docx-revision-v1'\n      : 'enerjisa-analysis-docx-postplan-v2'", "      ? 'enerjisa-analysis-docx-revision-v1'\n      : contextualEnerjisaCreation\n        ? 'enerjisa-analysis-docx-contextual-v1'\n        : 'enerjisa-analysis-docx-postplan-v2'", 1)
          router.write_text(r)

          Path('src/services/__tests__/contextualBaArtifactRoutingRegression.test.ts').write_text('''import { describe, expect, it } from 'vitest'\nimport fs from 'node:fs'\n\ndescribe('contextual BA artifact routing regression', () => {\n  const orchestrator = fs.readFileSync('supabase/functions/_shared/semanticOrchestrator.ts','utf8')\n  const router = fs.readFileSync('supabase/functions/openai-assistant-v2-entry-router/index.ts','utf8')\n  it('requires enterprise knowledge for structured requirements', () => {\n    expect(orchestrator).toContain('knowledgeRequired: userProvidedRequirements ? true : route.knowledgeRequired')\n    expect(orchestrator).toContain('enterpriseGroundingRequired: userProvidedRequirements')\n    expect(orchestrator).toContain('enterpriseGroundingRequired: inputPlan.enterpriseGroundingRequired === true')\n  })\n  it('carries prior BA context into first-time document follow-ups', () => {\n    expect(router).toContain('loadRecentArtifactContext')\n    expect(router).toContain('contextualEnerjisaCreation')\n    expect(router).toContain('[KULLANICI DEVAM TALİMATI]')\n    expect(router).toContain('enerjisa-analysis-docx-contextual-v1')\n  })\n})\n''')
          PY
      - run: npx vitest run src/services/__tests__/contextualBaArtifactRoutingRegression.test.ts src/services/__tests__/baAnalysisIntelligenceRegression.test.ts src/services/__tests__/groundingCoverageRegression.test.ts src/services/__tests__/technicalIdentifier.test.ts src/services/__tests__/reasoningAgentLoopV3.test.ts src/services/__tests__/pythonDocxArtifactWorker.test.ts
      - run: npm run verify:assistant-runtime
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/semanticOrchestrator.ts supabase/functions/openai-assistant-v2-entry-router/index.ts src/services/__tests__/contextualBaArtifactRoutingRegression.test.ts
          git commit -m 'fix: carry BA context into artifact and evidence planning'
          git push
