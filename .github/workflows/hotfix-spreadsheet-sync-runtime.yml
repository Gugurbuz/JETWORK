name: Spreadsheet Sync Runtime Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-spreadsheet-sync-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        run: python scripts/hotfix-spreadsheet-sync-runtime.py
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: complete attached Jira spreadsheet syncs"
          git push origin HEAD:main
