name: Validate BA artifact evidence finalization
on:
  push:
    branches:
      - fix/ba-artifact-evidence-finalization
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Apply runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('supabase/functions/openai-assistant-v2-entry-router/index.ts')
          r = router.read_text()
          old_sig = """async function loadRecentArtifactContext(\n  client: ReturnType<typeof createClient>,\n  workspaceId: string,\n  messageId: string,\n) {\n"""
          new_sig = """async function loadRecentArtifactContext(\n  client: ReturnType<typeof createClient>,\n  workspaceId: string,\n  messageId: string,\n  currentMessage: string,\n) {\n"""
          assert old_sig in r
          r = r.replace(old_sig, new_sig, 1)
          old_pick = """  const rows = (data || []).filter(row => String(row.id || '') !== messageId)\n  const priorUserRow = rows.find(row => row.role === 'user' && clean(row.text, 26_000))\n  const priorUser = priorUserRow ? clean(priorUserRow.text, 26_000) : ''\n"""
          new_pick = """  const rows = (data || []).filter(row => String(row.id || '') !== messageId)\n  const currentUserText = clean(currentMessage, 26_000)\n  const priorUserRows = rows.filter(row => (\n    row.role === 'user'\n    && clean(row.text, 26_000)\n    && clean(row.text, 26_000) !== currentUserText\n  ))\n  // Short retry/follow-up messages must not replace the substantive requirement\n  // that the artifact is supposed to represent. Prefer the nearest substantial\n  // user input; fall back to the latest distinct user input when none exists.\n  const priorUserRow = priorUserRows.find(row => clean(row.text, 26_000).length >= 400) || priorUserRows[0]\n  const priorUser = priorUserRow ? clean(priorUserRow.text, 26_000) : ''\n"""
          assert old_pick in r
          r = r.replace(old_pick, new_pick, 1)
          old_call = "await loadRecentArtifactContext(client, workspaceId, messageId)"
          assert old_call in r
          r = r.replace(old_call, "await loadRecentArtifactContext(client, workspaceId, messageId, message)", 1)
          router.write_text(r)

          core = Path('supabase/functions/openai-assistant-core-v2/implementation.ts')
          s = core.read_text()
          old_artifact_guard = """          runItems.push(...output)\n          const hasSkillCalls = functionCalls.some((call: Record<string, unknown>) => isSkillTool(cleanString(call.name, 120)))\n          emitStatus('synthesizing', hasSkillCalls ? 'İlgili JetWork skill prosedürleri yükleniyor...' : 'Sentez sırasında ek teknik kanıt isteniyor...')\n          for (const call of functionCalls) {\n"""
          new_artifact_guard = """          runItems.push(...output)\n          const hasSkillCalls = functionCalls.some((call: Record<string, unknown>) => isSkillTool(cleanString(call.name, 120)))\n          emitStatus('synthesizing', hasSkillCalls ? 'İlgili JetWork skill prosedürleri yükleniyor...' : 'Sentez sırasında ek teknik kanıt isteniyor...')\n          let enterpriseArtifactEvidenceRetryRequested = false\n          for (const call of functionCalls) {\n"""
          assert old_artifact_guard in s
          s = s.replace(old_artifact_guard, new_artifact_guard, 1)

          old_tool_exec = """            let args: Record<string, unknown> = {}\n            try { args = JSON.parse(String(call.arguments || '{}')) } catch { args = {} }\n            try {\n              const result = isSkillTool(toolName)\n"""
          new_tool_exec = """            let args: Record<string, unknown> = {}\n            try { args = JSON.parse(String(call.arguments || '{}')) } catch { args = {} }\n            if (\n              toolName === 'create_document_file'\n              && plan.enterpriseGroundingRequired === true\n              && !knowledgeUsed\n              && !enterpriseArtifactEvidenceRetryRequested\n            ) {\n              enterpriseArtifactEvidenceRetryRequested = true\n              runItems.push({\n                type: 'function_call_output',\n                call_id: callId,\n                output: JSON.stringify({\n                  error: 'ENTERPRISE_EVIDENCE_EMPTY_REVISE_ARTIFACT',\n                  instruction: 'Kurumsal arama doğrulanmış kanıt üretmedi. Artifactı yeniden hazırla: yalnız kullanıcının açıkça verdiği gerçekleri kesin bilgi olarak kullan. Sistem/modül/rol/SLA-performans/entegrasyon/veri kaynağı/hata mesajı/yasal-teknik uygulama ayrıntıları kullanıcı metninde açıkça yoksa [AÇIK KONU] veya [ÖNERİ] olarak işaretle; uydurma.',\n                }),\n              })\n              runItems.push({\n                role: 'developer',\n                content: 'ENTERPRISE_EVIDENCE_EMPTY: Doğrulanmış kurumsal evidence bulunamadı. Kullanıcının mevcut talep metni yalnız açıkça söylediği gerçekler için kanıttır. Sistem/modül, rol, SLA veya performans sayısı, entegrasyon mekanizması, veri kaynağı, hata metni, mevzuat/yasal nitelik ve teknik implementasyon gibi belirtilmemiş ayrıntıları kesin bilgi olarak yazma; [AÇIK KONU] veya [ÖNERİ] yap. Enerjisa şablon başlıklarını değiştirme.',\n              })\n              usage = addUsage(usage, { enterprise_artifact_evidence_retry: 1 })\n              emitStatus('verifying', 'Kurumsal kanıt bulunmadığı için doküman yalnız doğrulanmış talep bilgileriyle yeniden hazırlanıyor...')\n              continue\n            }\n            try {\n              const result = isSkillTool(toolName)\n"""
          assert old_tool_exec in s
          s = s.replace(old_tool_exec, new_tool_exec, 1)

          old_catch = """      } catch (streamError) {\n        console.error('Reasoning assistant stream failed:', streamError)\n        if (!turnCompleted) {\n          const { error: failError } = await adminClient.rpc('fail_assistant_turn', {\n"""
          new_catch = """      } catch (streamError) {\n        console.error('Reasoning assistant stream failed:', streamError)\n        if (!turnCompleted && semanticArtifactRequired() && generatedArtifacts.size > 0) {\n          const recoveryText = 'Doküman oluşturuldu.'\n          const stateItems = compactConversationState([...baseItems, { role: 'assistant', content: recoveryText }])\n          const { error: recoveryCompletionError } = await adminClient.rpc('complete_assistant_turn', {\n            p_turn_id: turnId, p_conversation_id: conversation.id, p_lease_token: leaseToken,\n            p_expected_revision: conversationRevision, p_state_items: stateItems,\n            p_response_text: recoveryText, p_source_refs: sources, p_usage: addUsage(usage, { artifact_finalization_recovered: 1 }) || {}, p_response_model: responseModel,\n          })\n          if (!recoveryCompletionError) {\n            turnCompleted = true\n            usage = addUsage(usage, { artifact_finalization_recovered: 1 })\n            await patchReasoningRun(adminClient, reasoningRunId, {\n              execution_trace: trace, knowledge_used: knowledgeUsed, web_used: webUsed, tool_call_count: totalToolCalls,\n              evidence_summary: { skillToolCalls, loadedSkills: [...loadedSkillKeys], artifactFinalizationRecovered: true },\n              fallback_used: providerFallbackUsed || reasoningFallbackUsed, status: 'completed', error_message: null, completed_at: new Date().toISOString(),\n            })\n            try {\n              emitGeneratedArtifacts()\n              sendEvent(controller, encoder, 'text_delta', { type: 'text_delta', delta: recoveryText })\n              sendEvent(controller, encoder, 'sources', { type: 'sources', sources })\n              sendEvent(controller, encoder, 'completed', {\n                type: 'completed', conversationId: conversation.id, model: responseModel, provider: activeProvider,\n                fallbackUsed: providerFallbackUsed || reasoningFallbackUsed, usage, recoveredArtifact: true,\n              })\n              controller.enqueue(encoder.encode('data: [DONE]\\n\\n')); controller.close()\n              return\n            } catch { return }\n          }\n          console.error('Artifact finalization recovery could not complete turn:', recoveryCompletionError)\n        }\n        if (!turnCompleted) {\n          const { error: failError } = await adminClient.rpc('fail_assistant_turn', {\n"""
          assert old_catch in s
          s = s.replace(old_catch, new_catch, 1)
          core.write_text(s)

          test = Path('src/services/__tests__/baArtifactEvidenceFinalizationRegression.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest'\nimport fs from 'node:fs'\n\ndescribe('BA artifact evidence and finalization recovery', () => {\n  const router = fs.readFileSync('supabase/functions/openai-assistant-v2-entry-router/index.ts', 'utf8')\n  const core = fs.readFileSync('supabase/functions/openai-assistant-core-v2/implementation.ts', 'utf8')\n\n  it('prefers a substantive prior requirement over repeated short follow-ups', () => {\n    expect(router).toContain('clean(row.text, 26_000).length >= 400')\n    expect(router).toContain('clean(row.text, 26_000) !== currentUserText')\n    expect(router).toContain('loadRecentArtifactContext(client, workspaceId, messageId, message)')\n  })\n\n  it('forces a user-evidence-only revision when enterprise evidence is empty', () => {\n    expect(core).toContain('ENTERPRISE_EVIDENCE_EMPTY_REVISE_ARTIFACT')\n    expect(core).toContain('enterprise_artifact_evidence_retry')\n    expect(core).toContain('Enerjisa şablon başlıklarını değiştirme')\n  })\n\n  it('recovers a completed artifact when later narration/finalization fails', () => {\n    expect(core).toContain('artifact_finalization_recovered')\n    expect(core).toContain('recoveredArtifact: true')\n    expect(core).toContain("const recoveryText = 'Doküman oluşturuldu.'")\n  })\n})\n""")
          PY
      - name: Focused regression tests
        run: npx vitest run src/services/__tests__/baArtifactEvidenceFinalizationRegression.test.ts src/services/__tests__/contextualBaArtifactRoutingRegression.test.ts src/services/__tests__/baAnalysisIntelligenceRegression.test.ts src/services/__tests__/groundingCoverageRegression.test.ts src/services/__tests__/reasoningAgentLoopV3.test.ts src/services/__tests__/pythonDocxArtifactWorker.test.ts src/services/__tests__/capabilitySystemV2.test.ts
      - run: npm run verify:assistant-runtime
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/openai-assistant-v2-entry-router/index.ts supabase/functions/openai-assistant-core-v2/implementation.ts src/services/__tests__/baArtifactEvidenceFinalizationRegression.test.ts
          git commit -m 'fix: harden BA artifact evidence and finalization'
          git push
