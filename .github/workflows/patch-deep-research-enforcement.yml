name: patch-deep-research-enforcement

on:
  push:
    branches:
      - agent/patch-deep-research-enforcement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-deep-research-enforcement
          fetch-depth: 0
      - name: Apply Deep Research enforcement patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          semantic = Path('supabase/functions/_shared/semanticOrchestrator.ts')
          replace_once(
              semantic,
              """const priorUserRequest = (conversation: SemanticContextMessage[]) => {\n  for (let index = conversation.length - 1; index >= 0; index -= 1) {\n    if (conversation[index].role !== 'user') continue\n    const content = cleanText(conversation[index].content, 1_200)\n    if (content) return content\n  }\n  return ''\n}\n""",
              """const priorUserRequest = (conversation: SemanticContextMessage[]) => {\n  for (let index = conversation.length - 1; index >= 0; index -= 1) {\n    if (conversation[index].role !== 'user') continue\n    const content = cleanText(conversation[index].content, 1_200)\n    if (!content || DEEP_RESEARCH_FOLLOW_UP_PATTERN.test(normalize(content))) continue\n    return content\n  }\n  return ''\n}\n""",
          )

          providers = Path('supabase/functions/_shared/modelProviders.ts')
          replace_once(
              providers,
              """const responseHasVisibleText = (response: NormalizedModelResponse): boolean => (\n  (response.output || []).some(item => {\n    if (item.type !== 'message' || !Array.isArray(item.content)) return false\n    return (item.content as Array<Record<string, unknown>>).some(part => (\n      typeof part.text === 'string' && String(part.text).trim().length > 0\n    ))\n  })\n)\n""",
              """const responseHasVisibleText = (response: NormalizedModelResponse): boolean => (\n  (response.output || []).some(item => {\n    if (item.type !== 'message' || !Array.isArray(item.content)) return false\n    return (item.content as Array<Record<string, unknown>>).some(part => (\n      typeof part.text === 'string' && String(part.text).trim().length > 0\n    ))\n  })\n)\n\nexport const responseHasProviderWebEvidence = (response: NormalizedModelResponse): boolean => (\n  Boolean(response.webSources?.length) || Boolean(response.webSearchQueries?.length)\n)\n""",
          )
          replace_once(
              providers,
              """  const bufferForAnswerability = shouldBufferForAnswerabilityGuard(plan)\n  let firstProviderText = ''\n""",
              """  const requireProviderWebEvidence = plan?.intent === 'research' && providerWebEnabled\n  const bufferForAnswerability = shouldBufferForAnswerabilityGuard(plan) || requireProviderWebEvidence\n  let firstProviderText = ''\n""",
          )
          replace_once(
              providers,
              """  if (bufferForAnswerability && firstProviderText) input.onText(answerability.text)\n\n  const firstUsage = usageWithGeminiEstimatedCost""",
              """  if (\n    bufferForAnswerability\n    && firstProviderText\n    && (!requireProviderWebEvidence || responseHasProviderWebEvidence(firstResponse))\n  ) input.onText(answerability.text)\n\n  const firstUsage = usageWithGeminiEstimatedCost""",
          )
          replace_once(
              providers,
              """  if (responseHasFunctionCall(firstResponse) || responseHasVisibleText(firstResponse)) {\n    return { ...firstResponse, usage: firstUsage }\n  }\n\n  // Gemini can occasionally finish a valid request with neither a function call\n""",
              """  if (\n    requireProviderWebEvidence\n    && !responseHasFunctionCall(firstResponse)\n    && !responseHasProviderWebEvidence(firstResponse)\n  ) {\n    const researchTarget = answerabilityRequestText(plan).slice(0, 2_000)\n    const requiredWebInstructions = [\n      geminiInstructions,\n      '[JETWORK REQUIRED WEB RESEARCH - MANDATORY EXECUTION]',\n      'Bu bir Deep Research turudur. Nihai yanıt üretmeden önce Google Search aracını gerçekten kullan. Yalnız model bilgisinden cevap verme.',\n      'Google Search çalıştıysa grounding kaynaklarını ve arama sorgularını response metadata içinde koru. Arama sonucunda güvenilir kaynak yoksa bunu açıkça belirt.',\n      researchTarget ? `Araştırma hedefi: ${researchTarget}` : '',\n    ].filter(Boolean).join('\\n\\n')\n    let requiredWebText = ''\n    const requiredWebResponse = await legacyRequestGeminiResponse({\n      ...input,\n      model: requestedModel,\n      instructions: requiredWebInstructions,\n      items: researchTarget ? [{ role: 'user', content: researchTarget }] : sanitizeItems(input.items),\n      tools: [],\n      allowTools: true,\n      onText: delta => { requiredWebText += delta },\n    })\n    assertExplicitGeminiModelPreserved(requestedModel, requiredWebResponse.model)\n    const webEvidenceObserved = responseHasProviderWebEvidence(requiredWebResponse)\n    const requiredWebAnswerability = shouldBufferForAnswerabilityGuard(plan)\n      ? sanitizeNovelCustomIdentifierClaims(requiredWebText, answerabilityRequestText(plan))\n      : { text: requiredWebText, removedSegments: 0, removedIdentifiers: [] as string[] }\n    const requiredWebUsage = usageWithGeminiEstimatedCost(String(requiredWebResponse.model || requestedModel), requiredWebResponse.usage, {\n      primary_llm_agent_calls: 1,\n      gemini_native_web_required_retry: 1,\n      gemini_native_web_required_executed: webEvidenceObserved ? 1 : 0,\n      ...(requiredWebResponse.webSources?.length ? { gemini_native_web_required_source_count: requiredWebResponse.webSources.length } : {}),\n      ...(!webEvidenceObserved ? { gemini_native_web_required_miss: 1 } : {}),\n      ...(requiredWebAnswerability.text !== requiredWebText ? {\n        grounding_preflight_custom_identifier_segments_removed: requiredWebAnswerability.removedSegments,\n        grounding_preflight_custom_identifiers_removed: requiredWebAnswerability.removedIdentifiers.length,\n      } : {}),\n    })\n\n    if (webEvidenceObserved) {\n      if (requiredWebText) input.onText(requiredWebAnswerability.text)\n      return {\n        ...requiredWebResponse,\n        usage: mergeNumericUsage(firstUsage, requiredWebUsage),\n      }\n    }\n\n    const deterministicWebMiss = 'Deep Research için Google Search çağrısını doğrulayamadım; web araştırmasını tamamlanmış saymıyorum. Kurumsal veya teknik ayrıntıları kaynak yokken uydurmuyorum.'\n    input.onText(deterministicWebMiss)\n    return {\n      id: `jetwork-required-web-miss:${crypto.randomUUID()}`,\n      status: 'completed',\n      model: String(requiredWebResponse.model || requestedModel),\n      output: [{\n        type: 'message',\n        role: 'assistant',\n        content: [{ type: 'output_text', text: deterministicWebMiss }],\n      }],\n      webSources: [],\n      webSearchQueries: [],\n      usage: mergeNumericUsage(firstUsage, requiredWebUsage),\n    }\n  }\n\n  if (responseHasFunctionCall(firstResponse) || responseHasVisibleText(firstResponse)) {\n    return { ...firstResponse, usage: firstUsage }\n  }\n\n  // Gemini can occasionally finish a valid request with neither a function call\n""",
          )

          test = Path('src/services/__tests__/primaryAgentWebRoutingRegression.test.ts')
          text = test.read_text()
          text = text.replace(
              """      conversation: [\n        { role: 'user', content: 'CHECK_ZTKS hangi mesajları üretiyor?' },\n        { role: 'assistant', content: 'Bu yanıtta doğrulanması gereken ayrıntı için yeterli kanıt bulunamadı.' },\n      ],\n""",
              """      conversation: [\n        { role: 'user', content: 'CHECK_ZTKS hangi mesajları üretiyor?' },\n        { role: 'assistant', content: 'Bu yanıtta doğrulanması gereken ayrıntı için yeterli kanıt bulunamadı.' },\n        { role: 'user', content: 'Bu yanıtı daha derin araştır. Gerektiğinde bilgi bankasını ve web kaynaklarını kullan; bulguları kaynaklarla karşılaştırıp doğrula.' },\n        { role: 'assistant', content: 'Önceki derin araştır denemesi tamamlanamadı.' },\n      ],\n""",
              1,
          )
          marker = """  it('does not call the OpenAI web preflight after Auto has routed the active model to Gemini', () => {\n"""
          insert = """  it('requires observable Gemini web evidence before accepting a Deep Research answer', () => {\n    const source = readFileSync(\n      new URL('../../../supabase/functions/_shared/modelProviders.ts', import.meta.url),\n      'utf8',\n    )\n\n    expect(source).toContain(\"const requireProviderWebEvidence = plan?.intent === 'research' && providerWebEnabled\")\n    expect(source).toContain('gemini_native_web_required_retry')\n    expect(source).toContain('gemini_native_web_required_miss')\n    expect(source).toContain('responseHasProviderWebEvidence(requiredWebResponse)')\n  })\n\n"""
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          text = text.replace(marker, insert + marker, 1)
          test.write_text(text)
          PY

          git config user.name "JetWork Agent"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/_shared/semanticOrchestrator.ts supabase/functions/_shared/modelProviders.ts src/services/__tests__/primaryAgentWebRoutingRegression.test.ts
          git commit -m "fix deep research target and web enforcement"
          git push origin HEAD:agent/fix-deep-research-enforcement
