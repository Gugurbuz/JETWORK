name: TTFT breakdown patch
on:
  push:
    branches: [agent/ttft-breakdown-telemetry]
    paths: [.github/workflows/ttft-breakdown-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/ttft-breakdown-telemetry, fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13, cache: pnpm}
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/ttft_patch.py
          python /tmp/ttft_patch.py
      - run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm lint
          pnpm test -- src/services/__tests__/coreLiveStreamingGate.test.ts src/services/__tests__/trueLiveStreamingContract.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: add end-to-end TTFT breakdown telemetry"
          git push origin HEAD:agent/ttft-breakdown-telemetry
