name: Temporary V5 acronym policy patch
on:
  push:
    branches:
      - fix/v5-acronym-definition-resolution
    paths:
      - scripts/tmp_patch_v5_acronym_policy.py
      - .github/workflows/tmp-v5-acronym-policy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5-acronym-definition-resolution
      - name: Apply patch
        run: python scripts/tmp_patch_v5_acronym_policy.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/agent/controllerPolicy.ts src/services/__tests__/controllerAcronymDefinitionPolicyV5.test.ts
          git commit -m "fix(agent): resolve standard acronyms with enterprise context"
          git push
