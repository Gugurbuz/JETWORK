name: Patch core live streaming gate

on:
  push:
    branches:
      - agent/fix-core-live-streaming-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-core-live-streaming-gate
          fetch-depth: 0
      - name: Apply streaming gate patch and regression test
        shell: python
        run: |
          from pathlib import Path

          core = Path('supabase/functions/openai-assistant-core-v2/implementation.ts')
          text = core.read_text()
          old = """            const canLiveStreamProviderText = activeProvider === 'gemini'\n              && geminiNativeWebPlanned\n              && plan.enterpriseGroundingRequired !== true\n              && plan.intent !== 'sap_diagnosis'\n              && !artifactMutationRequested\n              && !spreadsheetSyncRequested\n              && !spreadsheetMutationRequested\n              && !spreadsheetCreateRequested\n"""
          new = """            const hasExactCustomIdentifierInRequest = /\\b(?:Z[A-Z0-9_]{2,}(?:-\\d{2,4})?|CHECK_[A-Z0-9_]+)\\b/u.test(message.toLocaleUpperCase('en-US'))\n            const canLiveStreamProviderText = activeProvider === 'gemini'\n              && plan.enterpriseGroundingRequired !== true\n              && plan.intent !== 'sap_diagnosis'\n              && !hasExactCustomIdentifierInRequest\n              && !artifactMutationRequested\n              && !spreadsheetSyncRequested\n              && !spreadsheetMutationRequested\n              && !spreadsheetCreateRequested\n"""
          if old not in text:
              raise SystemExit('Expected live streaming gate not found; refusing blind patch.')
          core.write_text(text.replace(old, new, 1))

          test = Path('src/services/__tests__/coreLiveStreamingGate.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'\n\nconst coreSource = readFileSync(\n  new URL('../../../supabase/functions/openai-assistant-core-v2/implementation.ts', import.meta.url),\n  'utf8',\n)\n\ndescribe('core live streaming gate', () => {\n  it('streams safe Gemini turns without requiring native web mode', () => {\n    const gateStart = coreSource.indexOf('const hasExactCustomIdentifierInRequest')\n    const gateEnd = coreSource.indexOf("if (activeProvider === 'gemini')", gateStart)\n    const gate = coreSource.slice(gateStart, gateEnd)\n    expect(gate).toContain("const canLiveStreamProviderText = activeProvider === 'gemini'")\n    expect(gate).not.toContain('&& geminiNativeWebPlanned')\n  })\n\n  it('keeps exact enterprise identifiers and high-risk turn classes buffered', () => {\n    expect(coreSource).toContain('hasExactCustomIdentifierInRequest')\n    expect(coreSource).toContain("plan.enterpriseGroundingRequired !== true")\n    expect(coreSource).toContain("plan.intent !== 'sap_diagnosis'")\n    expect(coreSource).toContain('!hasExactCustomIdentifierInRequest')\n    expect(coreSource).toContain('!artifactMutationRequested')\n  })\n\n  it('still emits each approved provider delta directly to SSE', () => {\n    expect(coreSource).toContain("sendEvent(controller, encoder, 'text_delta', { type: 'text_delta', delta })")\n    expect(coreSource).toContain('roundTextStreamed = true')\n  })\n})\n""")

          Path('.github/workflows/patch-core-live-streaming-gate.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stream safe Gemini answers through core"
          git push origin HEAD:agent/fix-core-live-streaming-gate
