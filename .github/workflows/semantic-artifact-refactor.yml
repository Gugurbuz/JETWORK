name: Semantic artifact routing refactor

on:
  push:
    branches: ["fix/semantic-artifact-routing"]
    paths:
      - ".github/workflows/semantic-artifact-refactor.yml"
      - "scripts/semantic_artifact_refactor.py"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/semantic_artifact_refactor.py
      - run: npx vitest run src/services/__tests__/capabilitySystemV2.test.ts src/services/__tests__/reasoningAgentLoopV3.test.ts
      - name: Commit validated refactor
        run: |
          rm .github/workflows/semantic-artifact-refactor.yml scripts/semantic_artifact_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore semantic artifact routing"
          git push origin HEAD:${GITHUB_REF_NAME}
