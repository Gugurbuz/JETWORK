name: Materialize Reasoning Core

on:
  push:
    branches:
      - feat/reasoning-quality-golden-set

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize last verified core implementation
        run: |
          set -euo pipefail
          SOURCE_COMMIT="199585a6cf054ab4059bc30e4c8bb25a1d5cac0e"
          TARGET="supabase/functions/openai-assistant-core-v2/implementation.ts"
          git show "${SOURCE_COMMIT}:supabase/functions/openai-assistant-v2/index.ts" > "${TARGET}"
          printf "// Versioned Reasoning Engine v2 core implementation.\nimport './implementation.ts'\n" > supabase/functions/openai-assistant-core-v2/index.ts

      - name: Commit materialized implementation when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/openai-assistant-core-v2; then
            echo "Reasoning core is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/openai-assistant-core-v2
          git commit -m "refactor: version reasoning core implementation"
          git push origin HEAD:feat/reasoning-quality-golden-set
