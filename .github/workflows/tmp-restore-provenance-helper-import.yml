name: Restore provenance helper import
on:
  push:
    branches: ["fix/provenance-helper-runtime-import"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provenance-helper-runtime-import
          fetch-depth: 0
      - run: python scripts/tmp_restore_provenance_helper_import.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/openai-assistant-core-v2/implementation.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(agent): restore mechanical provenance helper"
          git push origin HEAD:fix/provenance-helper-runtime-import
