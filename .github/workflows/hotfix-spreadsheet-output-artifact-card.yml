name: Spreadsheet Output Artifact Card Hotfix

on:
  push:
    branches:
      - fix/spreadsheet-output-artifact-card
    paths:
      - '.github/workflows/hotfix-spreadsheet-output-artifact-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        run: python scripts/hotfix-spreadsheet-output-artifact-card.py
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: deliver spreadsheet outputs as secure file cards"
          git push origin HEAD:fix/spreadsheet-output-artifact-card
