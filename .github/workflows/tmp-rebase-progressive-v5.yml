name: Temporary rebase progressive V5
on:
  push:
    branches: ["feat/progressive-capability-disclosure-rebased"]
permissions:
  contents: write
jobs:
  rebase-v5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/progressive-capability-disclosure-rebased
          fetch-depth: 0
      - name: Overlay PR260 files on current main
        run: |
          git fetch origin feat/progressive-capability-disclosure
          git checkout origin/feat/progressive-capability-disclosure -- \
            src/services/__tests__/agentControllerExplicitSourceRequest.test.ts \
            src/services/__tests__/agenticSemanticAuthorityLeakRegression.test.ts \
            src/services/__tests__/controllerCandidateVerificationProtocol.test.ts \
            src/services/__tests__/controllerCapabilitySurfaceV2.test.ts \
            src/services/__tests__/controllerTopKRuntimeWiringV2.test.ts \
            src/services/__tests__/liveRuntimeStatusGrounding.test.ts \
            src/services/__tests__/progressiveCapabilityDisclosure.test.ts \
            src/services/__tests__/verifiedMessageIndexGroundingRegression.test.ts \
            supabase/functions/_shared/capabilities/controllerSurface.ts \
            supabase/functions/_shared/capabilities/progressiveDisclosure.ts
          rm -f .github/workflows/tmp-rebase-progressive-v5.yml
      - name: Commit clean rebased package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "rebase(agent): progressive capability disclosure V5 on current main"
          git push origin HEAD:feat/progressive-capability-disclosure-rebased
