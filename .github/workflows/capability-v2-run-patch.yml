name: Capability V2 run patch
on:
  push:
    branches:
      - feat/capability-system-v2-master
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capability-system-v2-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/capability_v2_guard_patch2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/_shared/executionTools.ts supabase/functions/openai-assistant-core-v2/implementation.ts src/services/__tests__/spreadsheetExecutionLayer.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce capability executor completion"
          git push origin HEAD:feat/capability-system-v2-master
