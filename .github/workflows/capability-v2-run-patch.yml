name: Capability V2 run patch
on:
  push:
    branches:
      - feat/capability-system-v2-master
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capability-system-v2-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/capability_v2_finalize_patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/assistantRuntimeClient.ts supabase/functions/openai-assistant-live-proxy/index.ts src/components/ChatPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: generalize action file routing and output cards"
          git push origin HEAD:feat/capability-system-v2-master
