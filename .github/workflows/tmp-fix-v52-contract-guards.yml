name: Temporary V5.2 contract guard alignment
on:
  push:
    branches:
      - fix/capability-menu-latency-v52
    paths:
      - .github/workflows/tmp-fix-v52-contract-guards.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capability-menu-latency-v52
      - name: Align contract text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/_shared/capabilities/controllerSurface.ts')
          s=p.read_text()
          start=s.index('  instruction: `The active model remains the sole semantic Controller.')
          end=s.index('`,\n})', start)+2
          new='''  instruction: `JetWork uses progressive capability disclosure and the active model remains the sole semantic Controller. The initial meta-tool already exposes this compact logical capability menu: ${JETWORK_LOGICAL_CAPABILITY_NAMES.join(', ')}. If the request needs no external capability, answer directly. If substantive tool-backed work is needed, publish report_progress(start) first. When exact capability names are obvious from the compact menu, the same first model output may include discover_more_capabilities with query="activate:name1,name2" after report_progress(start); do not call query="index" merely to re-read names already visible to you. Use query="index" only when the compact menu is insufficient and Layer-1 summaries are materially needed. activate returns the selected names' usage guides and mechanically activates their exact canonical schemas for the next round. Then call the canonical tool itself. When multiple already-justified tool calls are independent, emit them in the same model response rather than serializing extra model rounds. Runtime performs exact-name/order validation only; schema and budget enforcement are mechanical and never choose semantics. Runtime performs exact-name/schema/order/budget validation only in the sense of mechanical guardrails; it never infers intent, chooses a capability, query, source, next tool or stop decision. Activated contracts are options, never mandatory next steps. Legacy compatibility remains available through query="guide:name1,name2" then query="contract:name1,name2"; do not use that two-round path for normal work.`,'''
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/capabilities/controllerSurface.ts
          git commit -m 'fix(agent): preserve semantic authority guard contracts'
          git push origin HEAD:fix/capability-menu-latency-v52
