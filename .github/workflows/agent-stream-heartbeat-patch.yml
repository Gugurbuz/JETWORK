name: Agent stream heartbeat patch

on:
  push:
    branches:
      - agent/fix-stream-idle-heartbeat

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-heartbeat-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stream-idle-heartbeat
          fetch-depth: 0
      - name: Apply heartbeat patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/openai-assistant-core-v2/implementation.ts')
          text = path.read_text()

          constant_anchor = "const MAX_CHAT_ATTACHMENT_CHARACTERS = 60_000\n"
          constant_insert = constant_anchor + "const STREAM_HEARTBEAT_MS = 5_000\n"
          if "const STREAM_HEARTBEAT_MS = 5_000" not in text:
              if constant_anchor not in text:
                  raise SystemExit('heartbeat constant anchor not found')
              text = text.replace(constant_anchor, constant_insert, 1)

          timeout_anchor = "      const runTimeout = setTimeout(() => runController.abort(new DOMException('Assistant run timed out.', 'TimeoutError')), RUN_TIMEOUT_MS)\n"
          heartbeat_insert = timeout_anchor + "      const streamHeartbeat = setInterval(() => {\n        try {\n          controller.enqueue(encoder.encode(': jetwork-heartbeat\\n\\n'))\n        } catch { /* downstream disconnected; run cleanup owns interval */ }\n      }, STREAM_HEARTBEAT_MS)\n"
          if "const streamHeartbeat = setInterval" not in text:
              if timeout_anchor not in text:
                  raise SystemExit('run timeout anchor not found')
              text = text.replace(timeout_anchor, heartbeat_insert, 1)

          cleanup_anchor = "      } finally {\n        clearTimeout(runTimeout)\n      }\n"
          cleanup_insert = "      } finally {\n        clearInterval(streamHeartbeat)\n        clearTimeout(runTimeout)\n      }\n"
          if "clearInterval(streamHeartbeat)" not in text:
              if cleanup_anchor not in text:
                  raise SystemExit('run cleanup anchor not found')
              text = text.replace(cleanup_anchor, cleanup_insert, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/openai-assistant-core-v2/implementation.ts
          git commit -m "fix: keep assistant SSE alive during long provider waits [heartbeat-applied]"
          git push origin HEAD:agent/fix-stream-idle-heartbeat
