name: Agent Work Live Canary

# Live rollout gate targets the isolated Agent Work gateway backed by the
# Controller V3 shadow chain.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/agent-work-meaningful-runtime-v2
    paths:
      - .github/workflows/agent-work-live-canary.yml
      - e2e/agent-work-live-canary.spec.ts
      - src/services/agentActivityReducer.ts
      - src/services/sseParser.ts
      - src/services/messageRepository.ts
      - supabase/functions/openai-assistant-core-v2/index.ts
      - supabase/functions/_shared/agentWorkSseAdapter.ts
      - supabase/functions/_shared/safeStreamSink.ts

permissions:
  contents: read

concurrency:
  group: agent-work-live-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meaningful-work:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: 'true'
      VITE_SUPABASE_URL: https://bpbbvjigostgrssnduhk.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_dzZaPjNDRK22UUwLXAiS4g_JerlvhHQ
      VITE_REASONING_ENGINE_V2: 'true'
      VITE_SINGLE_ASSISTANT_RUNTIME: 'true'
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_ASSISTANT_CANARY_SLUG: agent-work-meaningful-v2-canary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require authenticated browser credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${E2E_USERNAME}" || { echo 'E2E_USERNAME secret is required'; exit 1; }
          test -n "${E2E_PASSWORD}" || { echo 'E2E_PASSWORD secret is required'; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated Agent Work canary
        run: pnpm test:e2e e2e/agent-work-live-canary.spec.ts

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-work-live-canary-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
