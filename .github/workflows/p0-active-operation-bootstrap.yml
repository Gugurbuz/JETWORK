name: P0 Active Operation Bootstrap

on:
  push:
    branches:
      - fix/p0-active-operation-grounding

permissions:
  contents: write

concurrency:
  group: p0-active-operation-grounding
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[p0-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-active-operation-grounding
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Reassemble and verify P0 patch
        run: |
          set -euo pipefail
          count=$(find .github/p0-bootstrap -maxdepth 1 -type f -name 'p.[0-9][0-9]' | wc -l | tr -d ' ')
          test "$count" = "17"
          cat .github/p0-bootstrap/p.[0-9][0-9] > /tmp/jetwork-p0.patch
          test "$(wc -c < /tmp/jetwork-p0.patch | tr -d ' ')" = "48648"
          echo '933b23d0734fcbb1af5e3ea8eb592a55865af55dbe40e71a9953f76729402690  /tmp/jetwork-p0.patch' | sha256sum -c -

      - name: Apply P0 source patch
        run: python .github/p0-bootstrap/apply_custom_patch.py /tmp/jetwork-p0.patch

      - name: Update prior-execution contract assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/__tests__/providerEvidenceIntentIntegrity.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "expect(gatewaySource).toContain('get_reasoning_debug_runs');"
          new = "expect(gatewaySource).toContain('get_prior_assistant_execution_context');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy prior-execution assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused P0 regressions
        run: >-
          pnpm exec vitest run
          src/services/__tests__/activeOperationContinuation.test.ts
          src/services/__tests__/groundingCoverageRegression.test.ts
          src/services/__tests__/p0HallucinationGroundingRegression.test.ts
          src/services/__tests__/enumerationFastPath.test.ts
          src/services/__tests__/reasoningEnumerationTarget.test.ts
          src/services/__tests__/conversationScopeInventoryV1.test.ts
          src/services/__tests__/inventoryRuntimeHardening.test.ts
          src/services/__tests__/edgeLatencyHardening.test.ts
          src/services/__tests__/providerEvidenceIntentIntegrity.test.ts

      - name: Run full unit suite
        run: pnpm test

      - name: Typecheck
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Remove bootstrap files
        run: |
          rm -rf .github/p0-bootstrap
          rm -f .github/workflows/p0-active-operation-bootstrap.yml

      - name: Commit clean P0 tree
        run: |
          set -euo pipefail
          git config user.name 'jetwork-p0-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            supabase/functions/_shared/operationState.ts \
            supabase/functions/_shared/groundingGuard.ts \
            supabase/migrations/20260811172000_active_operation_context.sql \
            src/services/__tests__/activeOperationContinuation.test.ts \
            src/services/__tests__/groundingCoverageRegression.test.ts \
            supabase/functions/_shared/reasoningEngine.ts \
            supabase/functions/_shared/semanticOrchestrator.ts \
            supabase/functions/_shared/conversationScopePolicy.ts \
            supabase/functions/_shared/enumerationFastPath.ts \
            supabase/functions/_shared/authoritativeInventoryFastPath.ts \
            supabase/functions/openai-assistant-v2/index.ts \
            supabase/functions/openai-assistant-core-v2/implementation.ts \
            src/services/__tests__/edgeLatencyHardening.test.ts \
            src/services/__tests__/inventoryRuntimeHardening.test.ts \
            src/services/__tests__/conversationScopeInventoryV1.test.ts \
            src/services/__tests__/reasoningEnumerationTarget.test.ts \
            src/services/__tests__/p0HallucinationGroundingRegression.test.ts \
            src/services/__tests__/enumerationFastPath.test.ts \
            src/services/__tests__/providerEvidenceIntentIntegrity.test.ts
          git add -u -- .github/p0-bootstrap .github/workflows/p0-active-operation-bootstrap.yml
          git diff --cached --check
          git status --short
          git commit -m 'P0: active operation continuation and claim grounding [p0-applied]'
          git push origin HEAD:fix/p0-active-operation-grounding
