name: Temporary V5 evidence synthesis hardening
on:
  push:
    branches: ["fix/v5-evidence-final-synthesis"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5-evidence-final-synthesis
          fetch-depth: 0
      - run: python scripts/tmp_v5_evidence_final_synthesis_hardening.py
      - run: |
          rm -f scripts/tmp_v5_evidence_final_synthesis_hardening.py
          rm -f .github/workflows/tmp-v5-evidence-final-synthesis-hardening.yml
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): harden tools-off evidence finalization"
          git push origin HEAD:fix/v5-evidence-final-synthesis
