name: Capability V2 one-shot patch

on:
  push:
    branches: [feat/capability-system-v2-master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capability-system-v2-master
      - name: Apply guarded wiring patches
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}')
              if found == 0:
                  raise SystemExit(f'{path}: block not found')
              p.write_text(text.replace(old, new))

          # Wire artifact tool menu into provider tool schemas.
          replace_exact(
              'supabase/functions/_shared/skillTools.ts',
              "import { ASSISTANT_EXECUTION_TOOLS } from './executionTools.ts'\n",
              "import { ASSISTANT_EXECUTION_TOOLS } from './executionTools.ts'\nimport { ASSISTANT_ARTIFACT_TOOLS } from './artifactExecutionTools.ts'\n",
              1,
          )
          replace_exact(
              'supabase/functions/_shared/skillTools.ts',
              "  ...ASSISTANT_EXECUTION_TOOLS,\n] as const\n",
              "  ...ASSISTANT_EXECUTION_TOOLS,\n  ...ASSISTANT_ARTIFACT_TOOLS,\n] as const\n",
              1,
          )

          # Dispatch artifact actions through authenticated assistant runtime.
          replace_exact(
              'supabase/functions/_shared/assistantTools.ts',
              "import { executeSpreadsheetAssistantTool } from './spreadsheetAssistantTool.ts'\n",
              "import { executeSpreadsheetAssistantTool } from './spreadsheetAssistantTool.ts'\nimport { isArtifactExecutionTool } from './artifactExecutionTools.ts'\nimport { executeArtifactAssistantTool } from './artifactAssistantTool.ts'\n",
              1,
          )
          replace_exact(
              'supabase/functions/_shared/assistantTools.ts',
              "  if (isExecutionTool(toolName)) return executeSpreadsheetAssistantTool(client, workspaceId, toolName, args)\n  throw new Error(`Unknown assistant tool: ${toolName}`)\n",
              "  if (isExecutionTool(toolName)) return executeSpreadsheetAssistantTool(client, workspaceId, toolName, args)\n  if (isArtifactExecutionTool(toolName)) return executeArtifactAssistantTool(client, workspaceId, toolName, args)\n  throw new Error(`Unknown assistant tool: ${toolName}`)\n",
              1,
          )

          # Multi-format attachments are action-ready by default.
          replace_exact(
              'src/components/ChatPanel.tsx',
              "import { createAssistantFileDownloadUrl } from '../services/assistantFileRepository';\n",
              "import { createAssistantFileDownloadUrl, isActionableExecutionAttachment } from '../services/assistantFileRepository';\n",
              1,
          )
          replace_exact(
              'src/components/ChatPanel.tsx',
              "  FEATURE_FLAGS.SINGLE_ASSISTANT_RUNTIME && isSpreadsheetToolAttachment(attachment)\n    ? 'tool_input'\n",
              "  FEATURE_FLAGS.SINGLE_ASSISTANT_RUNTIME && isActionableExecutionAttachment(attachment)\n    ? 'tool_input'\n",
              1,
          )
          replace_exact(
              'src/components/ChatPanel.tsx',
              "            mimeType: 'text/plain',\n            name: file.name,\n            file: file,\n            attachmentId: crypto.randomUUID(),\n            purpose: 'chat_only',\n",
              "            mimeType: file.type || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',\n            name: file.name,\n            file: file,\n            attachmentId: crypto.randomUUID(),\n            purpose: defaultAttachmentPurpose({ name: file.name, mimeType: file.type || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }),\n",
              2,
          )
          replace_exact(
              'src/components/ChatPanel.tsx',
              "      && !isSpreadsheetToolAttachment(target)\n",
              "      && !isActionableExecutionAttachment(target)\n",
              1,
          )
          replace_exact(
              'src/components/ChatPanel.tsx',
              "              ? (isSpreadsheetToolAttachment(attachment) ? 'tool_input' : 'chat_only')\n",
              "              ? (isActionableExecutionAttachment(attachment) ? 'tool_input' : 'chat_only')\n",
              1,
          )

          # Modern compact attachment cards; filename is primary, runtime state is secondary.
          p = Path('src/components/ChatPanel.tsx')
          text = p.read_text()
          start_marker = "            {selectedAttachments.length > 0 && (\n"
          end_marker = "            {!FEATURE_FLAGS.SINGLE_ASSISTANT_RUNTIME && showSuggestions"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('ChatPanel attachment preview markers not found')
          new_block = '''            {selectedAttachments.length > 0 && (\n              <div className="absolute bottom-full mb-2 left-0 right-0 flex gap-2 overflow-x-auto rounded-xl border border-theme-border bg-theme-surface/95 p-2 shadow-lg backdrop-blur-sm">\n                {selectedAttachments.map((att, idx) => {\n                  const extension = (att.name?.split('.').pop() || 'FILE').toUpperCase();\n                  const actionReady = att.purpose === 'tool_input' || (FEATURE_FLAGS.SINGLE_ASSISTANT_RUNTIME && isActionableExecutionAttachment(att));\n                  const stateLabel = att.purpose === 'knowledge_bank' ? 'Bilgi bankası' : actionReady ? 'Hazır' : 'Sohbet eki';\n                  return (\n                    <div key={att.attachmentId || idx} className="group/file relative flex h-16 min-w-[280px] max-w-[360px] shrink-0 items-center gap-3 rounded-xl border border-theme-border/80 bg-theme-bg px-3 py-2 shadow-sm transition-colors hover:border-theme-primary/45">\n                      {att.mimeType.startsWith('image/') ? (\n                        <img src={att.url} alt="upload preview" className="h-10 w-10 shrink-0 rounded-lg border border-theme-border/60 object-cover" />\n                      ) : (\n                        <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-theme-primary/20 bg-theme-primary/5 text-theme-primary">\n                          <FileText size={19} />\n                        </div>\n                      )}\n                      <div className="min-w-0 flex-1">\n                        <div className="truncate text-xs font-semibold text-theme-text" title={att.name}>{att.name || 'Dosya'}</div>\n                        <div className="mt-1 flex items-center gap-1.5 text-[10px] text-theme-text-muted">\n                          <span className="font-semibold">{extension}</span>\n                          <span>·</span>\n                          <span className={cn('inline-flex items-center gap-1', actionReady && 'text-theme-primary')}>\n                            {actionReady && <Check size={11} />} {stateLabel}\n                          </span>\n                        </div>\n                      </div>\n                      {FEATURE_FLAGS.SINGLE_ASSISTANT_RUNTIME && supportsKnowledgeBank(att) && (\n                        <button\n                          type="button"\n                          onClick={() => toggleAttachmentPurpose(idx)}\n                          className={cn(\n                            'shrink-0 rounded-full border px-2 py-1 text-[9px] font-semibold transition-colors',\n                            att.purpose === 'knowledge_bank'\n                              ? 'border-theme-primary/40 bg-theme-primary/10 text-theme-primary'\n                              : 'border-theme-border bg-theme-surface text-theme-text-muted hover:border-theme-primary/35',\n                          )}\n                          title="Dosyayı kalıcı bilgi bankası ile bu görevde kullanılabilir action dosyası arasında değiştir"\n                        >\n                          {att.purpose === 'knowledge_bank' ? 'Bilgi bankası' : 'Görev dosyası'}\n                        </button>\n                      )}\n                      <button\n                        type="button"\n                        onClick={() => removeAttachment(idx)}\n                        className="absolute -right-1.5 -top-1.5 rounded-full border border-theme-border bg-theme-bg p-0.5 text-theme-text-muted opacity-0 shadow-sm transition-opacity hover:text-theme-text group-hover/file:opacity-100"\n                        aria-label="Dosyayı kaldır"\n                      >\n                        <X size={12} />\n                      </button>\n                    </div>\n                  );\n                })}\n              </div>\n            )}\n            \n'''
          p.write_text(text[:start] + new_block + text[end:])

          # Prefer extension-derived MIME for binary Office files even when legacy preview text uses text/plain.
          replace_exact(
              'src/services/assistantFileRepository.ts',
              "  const mime = String(attachment.mimeType || '').trim().toLocaleLowerCase('en-US');\n  if (ACTIONABLE_MIME_TYPES.has(mime)) return mime;\n  return MIME_BY_EXTENSION[extensionOf(attachment.name)] || mime || 'application/octet-stream';\n",
              "  const mime = String(attachment.mimeType || '').trim().toLocaleLowerCase('en-US');\n  const extensionMime = MIME_BY_EXTENSION[extensionOf(attachment.name)];\n  if (extensionMime) return extensionMime;\n  if (ACTIONABLE_MIME_TYPES.has(mime)) return mime;\n  return mime || 'application/octet-stream';\n",
              1,
          )
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/_shared/skillTools.ts supabase/functions/_shared/assistantTools.ts src/components/ChatPanel.tsx src/services/assistantFileRepository.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire capability v2 artifact runtime"
          git push origin HEAD:feat/capability-system-v2-master
