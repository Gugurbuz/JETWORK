name: Grounding Gap V4 Patch
on:
  push:
    branches: ["fix/verified-message-gap-repair-v4"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verified-message-gap-repair-v4
          fetch-depth: 0
      - run: python scripts/tmp_patch_grounding_gap_v4.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/groundingGuard.ts src/services/__tests__/groundingCoverageRegression.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(agent): reject verified message evidence gaps"
          git push origin HEAD:fix/verified-message-gap-repair-v4
