name: Apply Semantic State Union Patch

on:
  push:
    branches:
      - fix/reasoning-semantic-model-and-failure-diagnostics
    paths:
      - '.github/workflows/semantic-state-union-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reasoning-semantic-model-and-failure-diagnostics
          fetch-depth: 0
      - name: Merge deterministic rejected hypotheses into semantic state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/_shared/semanticOrchestrator.ts')
          text = path.read_text()
          old = """  const state = value.conversationState && typeof value.conversationState === 'object'\n    ? value.conversationState\n    : fallback.conversationState\n"""
          new = """  const proposedState = value.conversationState && typeof value.conversationState === 'object'\n    ? value.conversationState\n    : fallback.conversationState\n  const fallbackRejectedHypotheses = fallback.conversationState?.rejectedHypotheses || []\n  const state: ConversationSemanticState | undefined = proposedState\n    ? {\n        ...proposedState,\n        rejectedHypotheses: [...new Set([\n          ...fallbackRejectedHypotheses,\n          ...(proposedState.rejectedHypotheses || []),\n        ])].slice(-6),\n      }\n    : fallback.conversationState\n"""
          if old not in text:
              raise SystemExit('Expected normalizePlan state block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit state union patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/semanticOrchestrator.ts
          git commit -m "fix: preserve rejected hypotheses across semantic plans"
          git push origin HEAD:fix/reasoning-semantic-model-and-failure-diagnostics
