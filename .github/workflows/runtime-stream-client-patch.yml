name: Runtime Stream One Shot Patch

on:
  push:
    branches:
      - fix/runtime-stream-stabilization-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-stream-stabilization-v2
          fetch-depth: 0

      - name: Apply exact codemod
        run: node scripts/apply-runtime-stream-stabilization.mjs

      - name: Remove one-shot tooling and commit source fix
        run: |
          git rm .github/workflows/runtime-stream-client-patch.yml
          git rm scripts/apply-runtime-stream-stabilization.mjs
          git rm -f src/services/__tests__/zzStreamLifecycleDiagnostic.test.ts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/assistantRuntimeClient.ts src/hooks/useMessages.ts
          git commit -m "fix: preserve completed assistant terminal state"
          git push origin HEAD:fix/runtime-stream-stabilization-v2
