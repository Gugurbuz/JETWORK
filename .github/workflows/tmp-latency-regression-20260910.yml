name: Temporary latency regression patch
on:
  push:
    branches:
      - fix/latency-regression-20260910
    paths:
      - scripts/tmp_patch_latency_regression_20260910.py
      - .github/workflows/tmp-latency-regression-20260910.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latency-regression-20260910
      - name: Apply latency patch
        run: python scripts/tmp_patch_latency_regression_20260910.py
      - name: Commit latency patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/geminiInteractionsRuntimeV3.ts supabase/functions/openai-assistant-core-v2/implementation.ts src/services/__tests__/geminiInteractionsAgentV3.test.ts src/services/__tests__/capabilityDisclosureControlPlaneBudgetV5.test.ts
          git diff --cached --check
          git commit -m "fix(agent): restore low-latency controller budgets"
          git push
