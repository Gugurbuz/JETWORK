name: Gemini 3.8 plan completion apply

on:
  push:
    branches:
      - feat/gemini38-product-plan-completion

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[plan-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini38-product-plan-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply product plan patch
        run: |
          node scripts/apply-gemini38-product-plan.mjs
          node scripts/fix-gemini38-generated.mjs
      - name: Typecheck
        run: pnpm lint
      - name: Unit and golden tests
        run: pnpm test && pnpm verify:reasoning-golden
      - name: Production build
        run: pnpm build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase src docs package.json pnpm-lock.yaml package-lock.json scripts || true
          git reset scripts/apply-gemini38-product-plan.mjs scripts/fix-gemini38-generated.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(gemini): complete product-plan runtime [plan-applied]"
          git push origin HEAD:feat/gemini38-product-plan-completion
