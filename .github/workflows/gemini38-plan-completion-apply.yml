name: Gemini 3.8 plan completion apply

on:
  push:
    branches:
      - feat/gemini38-product-plan-completion

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[plan-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini38-product-plan-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply product plan patch
        run: |
          node scripts/apply-gemini38-product-plan.mjs
          node scripts/fix-gemini38-generated.mjs
      - name: Typecheck
        run: pnpm lint
      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test -- --reporter=verbose 2>&1 | tee unit-test-output.txt
      - name: Reasoning golden
        id: golden
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:reasoning-golden 2>&1 | tee reasoning-golden-output.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini38-plan-diagnostics-${{ github.run_id }}
          path: |
            unit-test-output.txt
            reasoning-golden-output.txt
          if-no-files-found: ignore
      - name: Enforce tests
        if: always()
        shell: bash
        run: |
          echo "unit=${{ steps.unit.conclusion }} golden=${{ steps.golden.conclusion }}"
          test "${{ steps.unit.conclusion }}" = "success"
          test "${{ steps.golden.conclusion }}" = "success"
      - name: Production build
        run: pnpm build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase src docs package.json pnpm-lock.yaml package-lock.json scripts || true
          git reset scripts/apply-gemini38-product-plan.mjs scripts/fix-gemini38-generated.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(gemini): complete product-plan runtime [plan-applied]"
          git push origin HEAD:feat/gemini38-product-plan-completion
