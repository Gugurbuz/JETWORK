export const buildGeminiRequiredWebResearchRequest = (input: {
  query: string
  complexity: ReasoningComplexity
  model?: string
}) => ({
  model: input.model || GEMINI_DETERMINISTIC_WEB_MODEL,
  input: input.query.slice(0, 1_500),
  system_instruction: [
    'You are JetWork deterministic web evidence collector.',
    'You MUST execute Google Search before producing any output. Search only for evidence relevant to the supplied research target.',
    'Prefer primary, official and recent sources. Do not invent internal company facts and do not treat public web results as proof of private enterprise behavior.',
    'Return concise research notes grounded only in the search results; the main JetWork model will perform final synthesis.',
  ].join('\n'),
  tools: [{ type: 'google_search', search_types: ['web_search'] }],
  generation_config: {
    max_output_tokens: input.complexity === 'high' ? 1_800 : 1_200,
    thinking_level: input.complexity === 'high' ? 'low' : 'minimal',
    tool_choice: 'any',
  },
  stream: false,
  store: false,
  background: false,
})

const interactionSteps = (payload: Record<string, unknown>) => (
  Array.isArray(payload.steps) ? payload.steps as Array<Record<string, unknown>> : []
)

const interactionGroundingCount = (payload: Record<string, unknown>) => {
  const usage = payload.usage && typeof payload.usage === 'object' && !Array.isArray(payload.usage)
    ? payload.usage as Record<string, unknown>
    : {}
  const counts = Array.isArray(usage.grounding_tool_count) ? usage.grounding_tool_count : []
  return counts.reduce((total: number, item: unknown) => {
    if (!item || typeof item !== 'object') return total
    const row = item as Record<string, unknown>
    return String(row.type || '') === 'google_search' ? total + Math.max(0, Number(row.count || 0)) : total
  }, 0)
}

const interactionSearchQueries = (payload: Record<string, unknown>) => {
  const queries: string[] = []
  for (const step of interactionSteps(payload)) {
    if (step.type !== 'google_search_call') continue
    const args = step.arguments && typeof step.arguments === 'object' && !Array.isArray(step.arguments)
      ? step.arguments as Record<string, unknown>
      : {}
    if (Array.isArray(args.queries)) queries.push(...args.queries.map(item => String(item || '').trim()).filter(Boolean))
    const single = String(args.query || '').trim()
    if (single) queries.push(single)
  }
  return [...new Set(queries)].slice(0, 12)
}

export const collectGeminiInteractionWebSources = (payload: Record<string, unknown>): ReasoningSourceRef[] => {
  const found: ReasoningSourceRef[] = []
  const append = (value: unknown, titleHint = '') => {
    const source = webSourceFromUnknown(value, titleHint)
    if (source) found.push(source)
  }
  for (const step of interactionSteps(payload)) {
    if (step.type === 'google_search_result' && Array.isArray(step.result)) {
      for (const result of step.result as Array<unknown>) append(result)
    }
    if (step.type !== 'model_output' || !Array.isArray(step.content)) continue
    for (const block of step.content as Array<Record<string, unknown>>) {
      if (!Array.isArray(block.annotations)) continue
      for (const annotation of block.annotations as Array<Record<string, unknown>>) {
        if (annotation.type === 'url_citation') append(annotation)
      }
    }
  }
  const seen = new Set<string>()
  return found.filter(source => {
    const key = source.url || source.sourceName
    if (!key || seen.has(key)) return false
    seen.add(key)
    return true
  }).slice(0, 20)
}

const geminiInteractionEvidenceText = (payload: Record<string, unknown>) => {
  const chunks: string[] = []
  for (const step of interactionSteps(payload)) {
    if (step.type === 'google_search_result' && Array.isArray(step.result)) {
      for (const result of step.result as Array<Record<string, unknown>>) {
        const url = safeUrl(result?.url)
        const title = String(result?.title || sourceNameFromUrl(url)).trim().slice(0, 500)
        const snippet = String(result?.snippet || '').trim().slice(0, 2_000)
        if (!url && !snippet) continue
        chunks.push(`[WEB_RESULT]\nTitle: ${title}\nURL: ${url}\n${snippet ? `Snippet: ${snippet}` : ''}`.trim())
      }
    }
    if (step.type !== 'model_output' || !Array.isArray(step.content)) continue
    for (const block of step.content as Array<Record<string, unknown>>) {
      if (block.type !== 'text' || typeof block.text !== 'string' || !block.text.trim()) continue
      chunks.push(`[GROUNDED_RESEARCH_NOTES]\n${block.text.trim().slice(0, 8_000)}`)
    }
  }
  return chunks.join('\n\n').slice(0, 18_000)
}

export const normalizeGeminiInteractionWebResearch = (
  payload: Record<string, unknown>,
  model = GEMINI_DETERMINISTIC_WEB_MODEL,
): WebResearchResult => {
  const steps = interactionSteps(payload)
  const stepSearchCount = steps.filter(step => step.type === 'google_search_call').length
  const groundingCount = interactionGroundingCount(payload)
  const searchCount = Math.max(stepSearchCount, groundingCount)
  const rawUsage = payload.usage && typeof payload.usage === 'object' && !Array.isArray(payload.usage)
    ? payload.usage as Record<string, unknown>
    : {}
  const inputTokens = Math.max(0, Number(rawUsage.total_input_tokens || 0))
  const outputTokens = Math.max(0, Number(rawUsage.total_output_tokens || 0))
  const reasoningTokens = Math.max(0, Number(rawUsage.total_thought_tokens || 0))
  const totalTokens = Math.max(0, Number(rawUsage.total_tokens || inputTokens + outputTokens + reasoningTokens))
  const estimatedCost = ((inputTokens * GEMINI_DETERMINISTIC_WEB_PRICING.input
    + (outputTokens + reasoningTokens) * GEMINI_DETERMINISTIC_WEB_PRICING.output) / 1_000_000)
  return {
    text: geminiInteractionEvidenceText(payload),
    sources: collectGeminiInteractionWebSources(payload),
    searchCount,
    searchQueries: interactionSearchQueries(payload),
    usage: {
      input_tokens: inputTokens,
      output_tokens: outputTokens,
      reasoning_tokens: reasoningTokens,
      total_tokens: totalTokens,
      estimated_cost_usd: Number(estimatedCost.toFixed(6)),
      primary_llm_agent_calls: 1,
      deterministic_web_executor_calls: 1,
      gemini_interactions_api_calls: 1,
      gemini_interactions_web_search_calls: searchCount,
      gemini_grounding_tool_calls: groundingCount,
    },
  }
}

export async function runRequiredGeminiWebResearch(input: {
  apiKey?: string
  query: string
  complexity: ReasoningComplexity
  model?: string
  signal?: AbortSignal
}): Promise<WebResearchResult> {
  if (!input.apiKey) return { text: '', sources: [], searchCount: 0, searchQueries: [] }
  const model = input.model || GEMINI_DETERMINISTIC_WEB_MODEL
  const response = await fetch(GEMINI_INTERACTIONS_URL, {
    method: 'POST',
    signal: input.signal,
    headers: {
      'x-goog-api-key': input.apiKey,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(buildGeminiRequiredWebResearchRequest({
      query: input.query,
      complexity: input.complexity,
      model,
    })),
  })
  const payload = await response.json().catch(() => ({})) as Record<string, unknown>
  if (!response.ok) {
    const error = payload.error && typeof payload.error === 'object' && !Array.isArray(payload.error)
      ? payload.error as Record<string, unknown>
      : {}
    throw new Error(String(error.message || `Gemini Interactions web research failed with ${response.status}.`))
  }
  return normalizeGeminiInteractionWebResearch(payload, model)
}

