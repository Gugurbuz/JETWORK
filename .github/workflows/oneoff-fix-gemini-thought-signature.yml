name: oneoff-fix-gemini-thought-signature

on:
  push:
    branches:
      - agent/fix-gemini-thought-signature

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gemini-thought-signature
          fetch-depth: 0
      - name: Patch fake Gemini thought signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path('supabase/functions/_shared/modelProvidersLegacy.ts')
          text = provider.read_text()
          old_const = "const INJECTED_GEMINI_THOUGHT_SIGNATURE = 'context_engineering_is_the_way to_go'\n"
          old_part = "          functionCall: { id: callId, name, args },\n          thoughtSignature: INJECTED_GEMINI_THOUGHT_SIGNATURE,\n"
          if old_const not in text or old_part not in text:
              raise SystemExit('Expected fake thought signature source was not found')
          text = text.replace(old_const, '', 1)
          text = text.replace(old_part, "          functionCall: { id: callId, name, args },\n", 1)
          provider.write_text(text)

          test = Path('src/services/__tests__/trueLiveStreamingContract.test.ts')
          test_text = test.read_text()
          old_test = '''  it('uses the Gemini streaming API and preserves signatures for injected tool calls', () => {\n    expect(providerSource).toContain('generateContentStream')\n    expect(providerSource).toContain("INJECTED_GEMINI_THOUGHT_SIGNATURE = 'context_engineering_is_the_way to_go'")\n    expect(providerSource).toContain('thoughtSignature: INJECTED_GEMINI_THOUGHT_SIGNATURE')\n    expect(providerSource).toContain('for await (const chunk of stream')\n  })'''
          new_test = '''  it('uses the Gemini streaming API without fabricating signatures for synthetic tool calls', () => {\n    expect(providerSource).toContain('generateContentStream')\n    expect(providerSource).not.toContain("INJECTED_GEMINI_THOUGHT_SIGNATURE = 'context_engineering_is_the_way to_go'")\n    expect(providerSource).not.toContain('thoughtSignature: INJECTED_GEMINI_THOUGHT_SIGNATURE')\n    expect(providerSource).toContain('_geminiContent: candidateContent')\n    expect(providerSource).toContain('for await (const chunk of stream')\n  })'''
          if old_test not in test_text:
              raise SystemExit('Expected streaming signature regression test was not found')
          test.write_text(test_text.replace(old_test, new_test, 1))

          workflow = Path('.github/workflows/oneoff-fix-gemini-thought-signature.yml')
          workflow.unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/modelProvidersLegacy.ts src/services/__tests__/trueLiveStreamingContract.test.ts .github/workflows/oneoff-fix-gemini-thought-signature.yml
          git commit -m 'fix: stop fabricating Gemini thought signatures'
          git push origin HEAD:agent/fix-gemini-thought-signature
