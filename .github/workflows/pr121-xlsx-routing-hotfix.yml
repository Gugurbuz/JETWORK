name: PR121 XLSX Routing Hotfix

on:
  push:
    branches:
      - feat/skill-runtime-foundation

permissions:
  contents: write

concurrency:
  group: pr121-xlsx-routing-hotfix
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: fix one-shot XLSX hotfix runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skill-runtime-foundation
          fetch-depth: 0

      - name: Apply exact XLSX execution routing patch
        run: python .github/scripts/pr121_xlsx_routing_hotfix.py

      - name: Remove one-shot patch files and commit
        run: |
          set -euo pipefail
          rm .github/workflows/pr121-xlsx-routing-hotfix.yml
          rm .github/scripts/pr121_xlsx_routing_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: route XLSX attachments to spreadsheet execution"
          git push origin HEAD:feat/skill-runtime-foundation
