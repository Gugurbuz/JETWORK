name: Gemini 3.8 plan 100

on:
  push:
    branches:
      - feat/gemini38-plan-100

permissions:
  contents: write

jobs:
  apply-verify:
    if: ${{ !contains(github.event.head_commit.message, '[g38-100-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini38-plan-100
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply plan-100 patch
        run: |
          node scripts/fix-gemini38-plan-100-patcher.mjs
          node scripts/apply-gemini38-plan-100.mjs
      - name: Typecheck
        run: pnpm lint
      - name: Full unit suite
        run: pnpm test
      - name: Gemini 3.8 G38 golden suite
        run: pnpm verify:gemini38-golden
      - name: Reasoning golden
        run: pnpm verify:reasoning-golden
      - name: Production build
        run: pnpm build
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase src package.json pnpm-lock.yaml package-lock.json docs || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(gemini): close G4 G6 G8 plan DoDs [g38-100-applied]"
          git push origin HEAD:feat/gemini38-plan-100
