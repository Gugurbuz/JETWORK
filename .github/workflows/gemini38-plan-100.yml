name: Gemini 3.8 materialize source

on:
  push:
    branches:
      - feat/gemini38-plan-100

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[g38-100-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini38-plan-100
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize plan-100 changes into real source files
        run: |
          node scripts/fix-gemini38-plan-100-patcher.mjs
          node scripts/apply-gemini38-plan-100.mjs
      - name: Commit materialized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase src package.json pnpm-lock.yaml package-lock.json docs || true
          if git diff --cached --quiet; then
            echo "No generated source changes"
            exit 0
          fi
          git commit -m "refactor(gemini): materialize plan changes into source [g38-100-materialized]"
          git push origin HEAD:feat/gemini38-plan-100
