name: TEMP Adaptive Green Energy Staging

on:
  push:
    branches:
      - fix/controller-adaptive-work-plan-v1

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTIC_GOLDEN_STAGING_URL: https://bdcttzoiquhfgasnfvtr.supabase.co
      AGENTIC_GOLDEN_PRODUCTION_URL: https://bpbbvjigostgrssnduhk.supabase.co
      AGENTIC_GOLDEN_ANON_KEY: ${{ secrets.AGENTIC_GOLDEN_ANON_KEY }}
      AGENTIC_GOLDEN_ACCESS_TOKEN: ${{ secrets.AGENTIC_GOLDEN_ACCESS_TOKEN }}
      AGENTIC_GOLDEN_MODEL: gemini-3.8-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run 3-turn adaptive green energy canary
        run: pnpm exec tsx scripts/run-adaptive-green-energy-staging.ts --confirm-staging --output evaluation/results/adaptive-green-energy-staging.json

      - name: Upload canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-green-energy-staging-${{ github.sha }}
          path: evaluation/results/adaptive-green-energy-staging.json
          if-no-files-found: warn
          retention-days: 1
