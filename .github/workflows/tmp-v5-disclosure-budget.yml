name: Temporary V5 disclosure budget patch
on:
  push:
    branches:
      - fix/v5-disclosure-control-plane-budget
    paths:
      - scripts/tmp_patch_v5_disclosure_budget.py
      - .github/workflows/tmp-v5-disclosure-budget.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5-disclosure-control-plane-budget
      - name: Apply patch
        run: python scripts/tmp_patch_v5_disclosure_budget.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/openai-assistant-core-v2/implementation.ts src/services/__tests__/capabilityDisclosureControlPlaneBudgetV5.test.ts
          git commit -m "fix(agent): separate disclosure control-plane budget"
          git push
