name: Long context route fix v2
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run long-context route fix v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/openai-assistant-v2-entry-router/index.ts')
          s = p.read_text()
          needle = "  const artifactRoute = routeDecision.artifactRoute || enerjisaAnalysisDocx\n  const target = enerjisaAnalysisDocx\n    ? 'openai-assistant-enerjisa-docx'\n    : artifactRoute || groundedRequirement\n      ? 'openai-assistant-v2-internal'\n      : 'openai-assistant-v2-primary'\n"
          replacement = "  // Long inputs require the full semantic/capability runtime. Intent is still\n  // resolved inside the semantic orchestrator, not here from business keywords.\n  const longContextNeedsReasoning = message.length >= 2_000\n  const artifactRoute = routeDecision.artifactRoute || enerjisaAnalysisDocx\n  const target = enerjisaAnalysisDocx\n    ? 'openai-assistant-enerjisa-docx'\n    : artifactRoute || groundedRequirement || longContextNeedsReasoning\n      ? 'openai-assistant-v2-internal'\n      : 'openai-assistant-v2-primary'\n"
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1))
          t = Path('src/services/__tests__/contextualBaArtifactRoutingRegression.test.ts')
          ts = t.read_text()
          marker = "expect(router).toContain('enerjisa-analysis-docx-contextual-v1')"
          if "longContextNeedsReasoning = message.length >= 2_000" not in ts:
              ts = ts.replace(marker, marker + "\n    expect(router).toContain('longContextNeedsReasoning = message.length >= 2_000')", 1)
          t.write_text(ts)
          PY
      - run: npx vitest run src/services/__tests__/contextualBaArtifactRoutingRegression.test.ts src/services/__tests__/reasoningAgentLoopV3.test.ts src/services/__tests__/baAnalysisIntelligenceRegression.test.ts src/services/__tests__/groundingCoverageRegression.test.ts
      - run: npm run verify:assistant-runtime
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/openai-assistant-v2-entry-router/index.ts src/services/__tests__/contextualBaArtifactRoutingRegression.test.ts
          git commit -m 'fix: route long BA context through semantic runtime'
          git push
