name: Temporary V5.2 capability menu patch
on:
  push:
    branches:
      - fix/capability-menu-latency-v52
    paths:
      - .github/workflows/tmp-patch-capability-menu-v52.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capability-menu-latency-v52
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('supabase/functions/_shared/capabilities/controllerSurface.ts')
          text = path.read_text()

          description_re = re.compile(r"  description: 'Progressively inspect JetWork capabilities without giving semantic authority to runtime\.[^\n]*',")
          description_new = '''  description: `Progressively inspect JetWork capabilities without giving semantic authority to runtime. Compact logical capability menu: ${JETWORK_LOGICAL_CAPABILITY_NAMES.join(', ')}. If the exact capability names are already obvious from this menu, call query="activate:name1,name2" directly; do not spend a model round on index merely to confirm known names. Call query="index" only when this compact menu is insufficient to choose safely. The active model chooses every name; runtime only validates exact names and exposes the selected canonical schemas. Legacy query="guide:name1,name2" then query="contract:name1,name2" remains available for compatibility/diagnostics, not the normal latency path.`,'''
          text, n = description_re.subn(description_new, text, count=1)
          if n != 1:
              raise SystemExit(f'description replacement count={n}')

          instruction_re = re.compile(r"  instruction: 'JetWork uses three-layer progressive capability disclosure and the active model remains the sole semantic Controller\.[^\n]*',")
          instruction_new = '''  instruction: `The active model remains the sole semantic Controller. The initial meta-tool already exposes this compact logical capability menu: ${JETWORK_LOGICAL_CAPABILITY_NAMES.join(', ')}. If the request needs no external capability, answer directly. If substantive tool-backed work is needed, publish report_progress(start) first. When the exact capability names are obvious from the compact menu, call discover_more_capabilities with query="activate:name1,name2" directly; do not call query="index" merely to re-read names already visible to you. Use query="index" only when the compact menu is insufficient and Layer-1 summaries are materially needed. activate returns the selected names' usage guides and mechanically activates their exact canonical schemas for the next round. Then call the canonical tool itself. When multiple already-justified tool calls are independent, emit them in the same model response rather than serializing extra model rounds. Runtime performs exact-name/schema/order/budget validation only; it never infers intent, chooses a capability, query, source, next tool or stop decision. Activated contracts are options, never mandatory next steps. Legacy compatibility remains available through query="guide:name1,name2" then query="contract:name1,name2"; do not use that two-round path for normal work.`,'''
          text, n = instruction_re.subn(instruction_new, text, count=1)
          if n != 1:
              raise SystemExit(f'instruction replacement count={n}')

          path.write_text(text)

          test = Path('src/services/__tests__/capabilityMenuFastPathV52.test.ts')
          test.write_text('''import { describe, expect, it } from 'vitest'\nimport {\n  buildControllerCapabilitySurface,\n  capabilitySessionObservation,\n  startControllerCapabilitySession,\n} from '../../../supabase/functions/_shared/capabilities/controllerSurface.ts'\n\ndescribe('Controller V5.2 compact capability menu fast path', () => {\n  it('keeps the physical provider surface tiny while making logical names visible without an index round', async () => {\n    const surface = buildControllerCapabilitySurface()\n    expect(surface.tools.map(tool => tool.name)).toEqual([\n      'report_progress',\n      'discover_more_capabilities',\n      'request_large_context',\n    ])\n    const discover = surface.tools.find(tool => tool.name === 'discover_more_capabilities')\n    expect(discover?.description).toContain('search_knowledge_catalog')\n    expect(discover?.description).toContain('get_abap_source')\n    expect(discover?.description).toContain('activate:name1,name2')\n  })\n\n  it('tells the semantic controller to skip index when the exact capability name is already obvious', async () => {\n    const session = await startControllerCapabilitySession({ client: null, query: 'GET_SATILABILIR_LIMIT' })\n    const observation = capabilitySessionObservation(session)\n    expect(observation.instruction).toContain('sole semantic Controller')\n    expect(observation.instruction).toContain('activate:name1,name2')\n    expect(observation.instruction).toContain('do not call query="index" merely to re-read names already visible to you')\n    expect(observation.instruction).toContain('Runtime performs exact-name/schema/order/budget validation only')\n  })\n})\n''')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/capabilities/controllerSurface.ts src/services/__tests__/capabilityMenuFastPathV52.test.ts
          git commit -m 'perf(agent): expose compact capability menu for direct activation'
          git push origin HEAD:fix/capability-menu-latency-v52
