name: Temporary V5.1 disclosure fast-path patch
on:
  push:
    branches:
      - fix/agentic-disclosure-latency-v51
    paths:
      - scripts/tmp_patch_disclosure_fastpath_v51.py
      - .github/workflows/tmp-patch-disclosure-fastpath-v51.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agentic-disclosure-latency-v51
      - name: Apply patch
        run: python scripts/tmp_patch_disclosure_fastpath_v51.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/capabilities/controllerSurface.ts src/services/__tests__/capabilityDisclosureFastPathV51.test.ts
          git diff --cached --check
          git commit -m "fix(agent): collapse capability disclosure rounds"
          git push
