name: Temporary broad Jetbase search patch
on:
  push:
    branches: ["fix/jetbase-broad-first-search"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jetbase-broad-first-search
          fetch-depth: 0
      - run: python scripts/tmp_broad_jetbase_search_patch.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/assistantTools.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(jetbase): keep semantic candidate search type-unfiltered"
          git push origin HEAD:fix/jetbase-broad-first-search
