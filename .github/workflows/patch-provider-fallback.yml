name: Provider fallback recovery patch

on:
  push:
    branches: ["fix/provider-fallback-timeout-recovery"]
    paths: [".github/workflows/patch-provider-fallback.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Apply semantic fallback patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/functions/openai-assistant-core-v2/implementation.ts')
          text = path.read_text()
          replacements = [
              ("const requestActiveProvider = async () => {", "const requestActiveProvider = async (forceNoTools = false) => {"),
              ("const skillToolsEnabled = !mustSynthesize && plan.intent !== 'research'", "const skillToolsEnabled = !forceNoTools && !mustSynthesize && plan.intent !== 'research'"),
              ("const knowledgeToolsEnabled = !mustSynthesize\n              && plan.knowledgeRequired", "const knowledgeToolsEnabled = !forceNoTools && !mustSynthesize\n              && plan.knowledgeRequired"),
              ("const providerWebEnabled = !mustSynthesize && plan.webMode !== 'none'", "const providerWebEnabled = !forceNoTools && !mustSynthesize && plan.webMode !== 'none'"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)}: {old[:70]}')
              text = text.replace(old, new, 1)
          old = """          try {
            response = await requestActiveProvider()
          } catch (providerError) {
            if (requestedModel !== AUTO_MODEL || activeProvider !== 'openai' || !geminiApiKey || runController.signal.aborted) throw providerError
            activeProvider = 'gemini'; activeModel = DEFAULT_GEMINI_MODEL; providerFallbackUsed = true; roundText = ''; roundTextStreamed = false
            emitStatus('planning', 'OpenAI sağlayıcısı başarısız oldu; yedek modele kontrollü geçiş yapılıyor...')
            response = await requestActiveProvider()
          }
"""
          new = """          try {
            response = await requestActiveProvider()
          } catch (providerError) {
            if (requestedModel !== AUTO_MODEL || activeProvider !== 'openai' || !geminiApiKey || runController.signal.aborted) throw providerError
            activeProvider = 'gemini'; activeModel = DEFAULT_GEMINI_MODEL; providerFallbackUsed = true; roundText = ''; roundTextStreamed = false
            const directNoToolFallback = plan.executionMode === 'direct'
              && plan.webMode === 'none'
              && plan.knowledgeRequired !== true
              && plan.enterpriseGroundingRequired !== true
            emitStatus('planning', 'OpenAI sağlayıcısı başarısız oldu; yedek modele kontrollü geçiş yapılıyor...')
            response = await requestActiveProvider(directNoToolFallback)
          }
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one provider fallback block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test = Path('src/services/__tests__/providerFallbackDirectSynthesis.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'\n\nconst coreSource = readFileSync(\n  new URL('../../../supabase/functions/openai-assistant-core-v2/implementation.ts', import.meta.url),\n  'utf8',\n)\nconst providerSource = readFileSync(\n  new URL('../../../supabase/functions/_shared/modelProvidersLegacy.ts', import.meta.url),\n  'utf8',\n)\n\ndescribe('provider fallback direct synthesis', () => {\n  it('drops tools only for semantic direct/no-retrieval fallback turns', () => {\n    expect(coreSource).toContain('const requestActiveProvider = async (forceNoTools = false)')\n    expect(coreSource).toContain('const skillToolsEnabled = !forceNoTools &&')\n    expect(coreSource).toContain('const knowledgeToolsEnabled = !forceNoTools &&')\n    expect(coreSource).toContain('const providerWebEnabled = !forceNoTools &&')\n    expect(coreSource).toContain(\"const directNoToolFallback = plan.executionMode === 'direct'\")\n    expect(coreSource).toContain(\"&& plan.webMode === 'none'\")\n    expect(coreSource).toContain('&& plan.knowledgeRequired !== true')\n    expect(coreSource).toContain('&& plan.enterpriseGroundingRequired !== true')\n    expect(coreSource).toContain('response = await requestActiveProvider(directNoToolFallback)')\n  })\n\n  it('uses the longer final-synthesis window when tools are disabled', () => {\n    expect(providerSource).toContain('const GEMINI_FINAL_SYNTHESIS_TIMEOUT_MS = 45_000')\n    expect(providerSource).toContain('const finalSynthesis = !input.allowTools && !trivialConversation')\n  })\n})\n""")
      - run: npx vitest run src/services/__tests__/providerFallbackDirectSynthesis.test.ts src/services/__tests__/geminiProTimeoutPolicy.test.ts src/services/__tests__/geminiFastFailover.test.ts src/services/__tests__/reasoningAgentLoopV3.test.ts
      - run: npm run verify:assistant-runtime
      - name: Commit validated fallback patch
        run: |
          rm .github/workflows/patch-provider-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden direct provider fallback"
          git push origin HEAD:${GITHUB_REF_NAME}
